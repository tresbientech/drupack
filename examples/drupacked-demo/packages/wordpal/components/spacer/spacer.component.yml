name: Spacer
description: 'Add white space between blocks and customize its height.'
status: stable
group: 'WordPress: design'
links:
  - 'https://github.com/WordPress/wordpress-develop/tree/trunk/src/wp-includes/blocks/spacer'
props:
  type: object
  properties:
    height:
      title: Height
      type: string
      examples:
        - 100px
      x-wordpal-panel: settings
    width:
      title: Width
      type: string
      x-wordpal-panel: settings
    anchor:
      title: Anchor
      type: string
      x-wordpal-panel: advanced
    css_class:
      title: 'CSS class'
      type: string
      x-wordpal-panel: advanced
    margin_top:
      title: 'Margin top'
      type: string
      x-wordpal-panel: dimensions
    margin_bottom:
      title: 'Margin bottom'
      type: string
      x-wordpal-panel: dimensions
    self_stretch:
      title: 'Self stretch'
      type: string
      enum:
        - fit
        - fill
        - fixed
        - fixedNoShrink
      'meta:enum':
        fit: Fit
        fill: Grow
        fixed: Max
        fixedNoShrink: Fixed
      x-wordpal-panel: dimensions
    flex_size:
      title: 'Flex size'
      type: string
      x-wordpal-panel: dimensions
