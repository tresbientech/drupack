name: Build a site

# A site repository calls this workflow at an engine tag. It builds the site's
# Linux executables in the engine's job image. Each macOS and Windows target
# packs on a runner of its own system, from the runtime files of an engine
# release. It uploads the executables, and with `publish` a tag run releases them
# in the caller's repository. The jobs declare no permissions and run with the
# ones the calling job grants.
on:
  workflow_call:
    inputs:
      repository:
        description: The site repository, as OWNER/NAME. Unset, the calling repository.
        type: string
      ref:
        description: The branch, tag or commit of the site repository to build. Unset, the ref of the calling run.
        type: string
      site:
        description: The site's directory, holding composer.json and drupack.yml.
        type: string
        default: .
      platforms:
        description: "Comma-separated targets: linux-amd64, linux-arm64, macos-amd64, macos-arm64, windows-amd64. Unset, drupack.yml's platforms."
        type: string
      libc:
        description: "The Linux files to build, one per C library: both, glibc or musl. Unset, drupack.yml's libc."
        type: string
      runtime-release:
        description: "The Drupack release whose macOS and Windows runtime files the native targets pack. A caller pinned to a tag uses that tag. A caller pinned to a branch or a commit must set it to build those targets."
        type: string
      publish:
        description: On a tag run, release the executables in the calling repository.
        type: boolean
        default: false
    secrets:
      COMPOSER_AUTH:
        description: Composer's auth.json content, for private packages the site requires.
        required: false

env:
  # Go moves to the next entry after a "|" on any error, so a module fetch the
  # proxy drops mid-stream gets a second attempt. go.sum checks either answer.
  GOPROXY: https://proxy.golang.org|https://proxy.golang.org,direct

jobs:
  # The github context of a called workflow names the caller. The OIDC token names
  # this file at the ref the caller pinned, so the calling job grants id-token: write.
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      image: ${{ steps.image.outputs.image }}
      repository: ${{ steps.image.outputs.repository }}
      commit: ${{ steps.image.outputs.commit }}
      runtime-release: ${{ steps.image.outputs.runtime_release }}
    steps:
      - id: image
        env:
          RUNTIME_RELEASE: ${{ inputs.runtime-release }}
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo 'The calling job must grant id-token: write, which names the engine ref.' >&2
            exit 1
          fi
          token=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=drupack" | jq -r .value)
          claims=$(printf '%s' "$token" | cut -d . -f 2 | tr '_-' '/+')
          # base64 needs the padding a JWT drops.
          while [ $(( ${#claims} % 4 )) -ne 0 ]; do claims="$claims="; done
          claims=$(printf '%s' "$claims" | base64 -d)
          workflow_ref=$(printf '%s' "$claims" | jq -r .job_workflow_ref)
          workflow_sha=$(printf '%s' "$claims" | jq -r .job_workflow_sha)
          repository=${workflow_ref%%/.github/*}
          # A caller pinned to an annotated tag gets the tag object's SHA in the token,
          # and an image carries the commit's. The tag must still name the signed SHA.
          prefix=dev
          runtime_release=$RUNTIME_RELEASE
          if [[ $workflow_ref == *@refs/tags/* ]]; then
            prefix=sha
            tag=refs/tags/${workflow_ref##*@refs/tags/}
            listing=$(git ls-remote "https://github.com/$repository" "$tag" "$tag^{}")
            object=$(awk -v ref="$tag" '$2 == ref {print $1}' <<<"$listing")
            commit=$(awk -v ref="$tag^{}" '$2 == ref {print $1}' <<<"$listing")
            commit=${commit:-$object}
            if [ "$workflow_sha" != "$object" ] && [ "$workflow_sha" != "$commit" ]; then
              echo "$tag no longer names $workflow_sha." >&2
              exit 1
            fi
            workflow_sha=$commit
            runtime_release=${tag#refs/tags/}
          fi
          # Every engine release run pushes its job image under the commit, before
          # any image carries the version. A caller pinned to a tag reads sha-COMMIT,
          # and any other caller dev-COMMIT.
          image=ghcr.io/$repository-build:$prefix-$workflow_sha
          echo "Engine: $workflow_ref ($workflow_sha), image $image"
          {
            printf 'image=%s\n' "$image"
            printf 'repository=%s\n' "$repository"
            printf 'commit=%s\n' "$workflow_sha"
            printf 'runtime_release=%s\n' "$runtime_release"
          } >>"$GITHUB_OUTPUT"

  # The job image carries the engine, its Linux runtimes and drupack-build. No
  # Docker daemon answers inside it, so the suite skips the cases that need one.
  # The build writes under /tmp: runner.temp names the host's path, not the
  # container's. It also exports the payload and lists the native targets for
  # the native jobs.
  build:
    needs: engine
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ${{ needs.engine.outputs.image }}
    outputs:
      native: ${{ steps.build.outputs.native }}
      version: ${{ steps.build.outputs.version }}
    # A container job runs steps with sh unless told otherwise.
    defaults:
      run:
        shell: bash
    steps:
      # composer install runs the site's plugins and scripts, so the checkout keeps no token.
      # checkout reads an empty repository or ref as the calling run's.
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Build the executables
        id: build
        env:
          SITE: ${{ inputs.site }}
          PLATFORMS: ${{ inputs.platforms }}
          LIBC: ${{ inputs.libc }}
          SHA: ${{ github.sha }}
          RUNTIME_RELEASE: ${{ needs.engine.outputs.runtime-release }}
          # composer install reads it, and an unset secret leaves it empty, which Composer ignores.
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=$GITHUB_REF_NAME
          else
            version=dev-${SHA:0:12}
          fi
          # The checkout belongs to the runner's user, and git refuses to list its files
          # for another one. drupack-build stages a site from that listing.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          targets=()
          if [ -n "$PLATFORMS" ]; then targets+=(--platform "$PLATFORMS"); fi
          if [ -n "$LIBC" ]; then targets+=(--libc "$LIBC"); fi
          # A native target packs a published runtime. A run that names no release
          # leaves --native out, and drupack-build then refuses such a target.
          native='[]'
          if [ -n "$RUNTIME_RELEASE" ]; then targets+=(--native); fi
          drupack-build --site "$SITE" "${targets[@]}" \
            --site-version "$version" --output /tmp/drupack/dist --work /tmp/drupack/work
          if [ -n "$RUNTIME_RELEASE" ]; then native=$(cat /tmp/drupack/dist/payload/native-targets.json); fi
          printf 'version=%s\nnative=%s\n' "$version" "$native" >>"$GITHUB_OUTPUT"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: /tmp/drupack/work/test-results

      # The payload stays out of the executables, and goes up only for the native jobs.
      - uses: actions/upload-artifact@v7
        with:
          name: executables
          path: |
            /tmp/drupack/dist
            !/tmp/drupack/dist/payload
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: steps.build.outputs.native != '[]'
        with:
          name: payload
          path: /tmp/drupack/dist/payload
          if-no-files-found: error

  # One job per macOS or Windows target, on a runner of that system. It packs the
  # payload with the runtime file of the engine release, and runs the conformance
  # suite on the result with the site's tests. The pack tool, the pack script and
  # the suite come from the engine commit the caller pinned.
  native:
    needs: [engine, build]
    if: needs.build.outputs.native != '[]'
    runs-on: ${{ matrix.target == 'macos-arm64' && 'macos-15' || matrix.target == 'macos-amd64' && 'macos-15-intel' || 'windows-2025' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.build.outputs.native) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          repository: ${{ needs.engine.outputs.repository }}
          ref: ${{ needs.engine.outputs.commit }}
          path: drupack-engine
          persist-credentials: false

      # The release workflow names the Go version the launcher builds with.
      - id: go
        run: |
          version=$(sed -n "s/^  GO_VERSION: '\(.*\)'$/\1/p" drupack-engine/.github/workflows/release.yml)
          [ -n "$version" ] || { echo 'release.yml names no GO_VERSION.' >&2; exit 1; }
          printf 'version=%s\n' "$version" >>"$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache: false

      - uses: actions/download-artifact@v8
        with:
          name: payload
          path: payload

      - name: Pack the site
        env:
          TARGET: ${{ matrix.target }}
          RUNTIME_RELEASE: ${{ needs.engine.outputs.runtime-release }}
          ENGINE_REPOSITORY: ${{ needs.engine.outputs.repository }}
          SITE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          name=$(jq -r .name payload/site.json)
          extension=
          if [ "$RUNNER_OS" = Windows ]; then extension=.exe; fi
          bash drupack-engine/build/native-pack.sh \
            --base-url "$GITHUB_SERVER_URL/$ENGINE_REPOSITORY/releases/download/$RUNTIME_RELEASE" \
            --target "$TARGET" --payload payload --output "dist/$name-$TARGET$extension" \
            --site-version "$SITE_VERSION"
          # The suite reads the site.json beside the executable it tests.
          cp payload/site.json dist/site.json
          printf 'EXECUTABLE=dist/%s\n' "$name-$TARGET$extension" >>"$GITHUB_ENV"

      # The executable uploads before the suite, so a run the suite hangs still keeps it.
      - uses: actions/upload-artifact@v7
        with:
          name: executable-${{ matrix.target }}
          path: ${{ env.EXECUTABLE }}
          if-no-files-found: error

      - name: Run the conformance suite
        env:
          SITE: ${{ inputs.site }}
        run: |
          python=python3
          if [ "$RUNNER_OS" = Windows ]; then python=python; fi
          tests=()
          if [ -d "$SITE/tests" ]; then tests=(--site-tests "$SITE/tests"); fi
          "$python" drupack-engine/tests/conformance "$EXECUTABLE" test-results/conformance ${tests[@]+"${tests[@]}"}

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.target }}
          path: test-results

  # php.net publishes no arm64 PHP, so Windows on Arm runs the windows-amd64
  # executable under emulation. This job runs the suite on it there.
  windows-arm:
    name: Windows arm64 (amd64 emulated)
    needs: [engine, build, native]
    if: contains(fromJSON(needs.build.outputs.native), 'windows-amd64')
    runs-on: windows-11-arm
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          repository: ${{ needs.engine.outputs.repository }}
          ref: ${{ needs.engine.outputs.commit }}
          path: drupack-engine
          persist-credentials: false

      # The suite packs its fixture launchers with the Go version the release workflow names.
      - id: go
        run: |
          $version = (Select-String -Path drupack-engine\.github\workflows\release.yml -Pattern "^  GO_VERSION: '(.*)'$").Matches.Groups[1].Value
          if (-not $version) { throw 'release.yml names no GO_VERSION.' }
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache: false

      - uses: actions/download-artifact@v8
        with:
          name: executable-windows-amd64
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: payload
          path: payload

      # The suite reads the site.json beside the executable it tests.
      - name: Run the conformance suite
        env:
          SITE: ${{ inputs.site }}
        run: |
          Copy-Item payload\site.json dist\site.json
          $executable = (Get-ChildItem dist\*.exe).FullName
          $tests = if (Test-Path (Join-Path $env:SITE 'tests')) { @('--site-tests', (Join-Path $env:SITE 'tests')) } else { @() }
          python drupack-engine\tests\conformance $executable test-results\conformance @tests

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-windows-arm64
          path: test-results

  # The calling job grants contents: write, id-token: write and attestations: write.
  publish:
    needs: [engine, build, native, windows-arm]
    # The native jobs are skipped when the build lists no native target, and the
    # Windows on Arm job when it lists no windows-amd64.
    if: >-
      !cancelled() && inputs.publish && github.ref_type == 'tag'
      && needs.build.result == 'success'
      && (needs.native.result == 'success' || needs.native.result == 'skipped')
      && (needs.windows-arm.result == 'success' || needs.windows-arm.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}

      # syft scans the site before the engine and the executables join the workspace.
      - name: Scan the site
        uses: anchore/sbom-action@v0
        with:
          path: ${{ inputs.site }}
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/site.cdx.json
          upload-artifact: false

      # The engine at the pinned commit holds the script that writes the release files.
      - uses: actions/checkout@v7
        with:
          repository: ${{ needs.engine.outputs.repository }}
          ref: ${{ needs.engine.outputs.commit }}
          path: drupack-engine
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          pattern: executable*
          path: executables
          merge-multiple: true

      # syft reads the launcher's Go modules from the executables.
      - name: Scan the executables
        uses: anchore/sbom-action@v0
        with:
          path: executables
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/executables.cdx.json
          upload-artifact: false

      # The job image's runtime reports what the executables carry compressed.
      - name: Write the SBOM
        env:
          IMAGE: ${{ needs.engine.outputs.image }}
        run: |
          docker run --rm "$IMAGE" \
            sh -c 'python3 "$DRUPACK_ENGINE/build/sbom.py" runtime "$DRUPACK_PHP"' >"$RUNNER_TEMP/runtime.json"
          python3 drupack-engine/build/sbom.py merge --name "$(jq -r .name executables/site.json)" --version "$VERSION" \
            --runtime-components "$RUNNER_TEMP/runtime.json" --site executables/site.json \
            --output "$RUNNER_TEMP/sbom.cdx.json" "$RUNNER_TEMP/site.cdx.json" "$RUNNER_TEMP/executables.cdx.json"

      # The build job's artifact also holds site.json, which names no target.
      - name: Write the release files
        run: |
          rm executables/site.json
          python3 drupack-engine/build/release-files.py --output release --version "$VERSION" \
            --base-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$VERSION" \
            --commit "$GITHUB_SHA" executables/*
          mv "$RUNNER_TEMP/sbom.cdx.json" release/

      - name: Attest the release files
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/*

      - name: Publish the GitHub Release
        run: |
          gh release create "$VERSION" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes
