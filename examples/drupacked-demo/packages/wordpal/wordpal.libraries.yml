# WordPress's unminified view modules, each copied by drush
# wordpal:generate-components. Each imports the Interactivity runtime by a
# relative path, so the runtime has no library of its own. Aggregation would
# concatenate a module with other scripts and break its import.
interactivity.navigation:
  js:
    js/script-modules/block-library/navigation/view.js: { attributes: { type: module }, preprocess: false }
interactivity.accordion:
  js:
    js/script-modules/block-library/accordion/view.js: { attributes: { type: module }, preprocess: false }
interactivity.search:
  js:
    js/script-modules/block-library/search/view.js: { attributes: { type: module }, preprocess: false }
interactivity.fit-text:
  js:
    js/script-modules/block-editor/utils/fit-text-frontend.js: { attributes: { type: module }, preprocess: false }
# Drupal's own page elements in the theme's style, on every page of a
# converted theme.
drupal_ui:
  css:
    component:
      css/drupal-ui.css: {}
# Pairs a preset select with the field a component form stores, on an
# inspector form.
inspector_presets:
  js:
    js/inspector-presets.js: {}
  dependencies:
    - core/drupal
    - core/once
