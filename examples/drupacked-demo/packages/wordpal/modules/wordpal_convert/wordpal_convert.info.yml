package: 'WordPal'
core_version_requirement: ^11.4
php: 8.4
dependencies:
  - wordpal:wordpal
test_dependencies:
  - wordpal:wordpal_canvas
  - wordpal:wordpal_display_builder
  - canvas:canvas
  - trash:trash
  - pathauto:pathauto
  - search_api:search_api
  - search_api:search_api_db
