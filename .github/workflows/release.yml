name: Release
# A tag run and a main push run find their candidate run by this name.
run-name: ${{ inputs.version != '' && inputs.platform == 'all' && format('Release candidate {0}', inputs.version) || '' }}

on:
  push:
    branches:
      - main
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  # The full suite once a week, on main and under a dev version, so Linux arm64 and Windows arm64,
  # which a gate candidate tests with their start cases alone, still run every case. It publishes nothing.
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
    inputs:
      platform:
        description: Target to build and test; a tag push builds every platform unless its candidate run did.
        type: choice
        default: all
        options:
          - all
          - linux-amd64
          - linux-arm64
          - macos-arm64
          - windows-amd64
      version:
        description: The version a candidate run builds, which its tag run then publishes.
        type: string
        default: ''
      suite:
        description: full tests every platform in full; gate tests Linux amd64, macOS arm64 and Windows amd64 in full and the others with their start cases.
        type: choice
        default: full
        options:
          - full
          - gate

permissions:
  contents: read

env:
  # setup-go sets GOTOOLCHAIN=local from v6 on, so go fetches no newer toolchain of
  # its own: this version must stay at or above the go line in FrankenPHP's
  # caddy/go.mod. Each go.mod here and the Dockerfile's golang image carry the same
  # version. build/release/upstream.py moves it to the newest patch and copies it there.
  GO_VERSION: '1.27.4'
  # Go moves to the next entry after a "|" on any error, so a module fetch the
  # proxy drops mid-stream gets a second attempt. go.sum checks either answer.
  GOPROXY: https://proxy.golang.org|https://proxy.golang.org,direct

jobs:
  # A tag whose candidate run succeeded publishes that run's files, and a main push of
  # that commit builds nothing. Other tags, dispatches and the schedule cover every
  # platform (a dispatch can name one). Another main push covers Linux amd64 when it
  # touched something an executable carries; the comparison runs here because GitHub
  # leaves path filters on tag pushes undocumented.
  gate:
    name: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      build: ${{ steps.targets.outputs.build }}
      candidate: ${{ steps.targets.outputs.candidate }}
      image_tags: ${{ steps.targets.outputs.image_tags }}
      version: ${{ steps.targets.outputs.version }}
      unit: ${{ steps.targets.outputs.unit }}
      runtime: ${{ steps.targets.outputs.runtime }}
      engine: ${{ steps.targets.outputs.engine }}
      platforms: ${{ steps.targets.outputs.platforms }}
      tests: ${{ steps.targets.outputs.tests }}
    steps:
      - uses: actions/checkout@v7

      # upstream.yml writes the bump table into the candidate commit's message.
      - name: Show the candidate's bump
        if: github.ref_type == 'tag' || inputs.version != ''
        run: git log -1 --format='### %s%n%n%b' >>"$GITHUB_STEP_SUMMARY"

      - id: targets
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          PLATFORM: ${{ inputs.platform || 'all' }}
          NAMED: ${{ inputs.version }}
          SUITE: ${{ inputs.suite }}
        run: |
          python3 build/release/release-plan.py --ref-type "$GITHUB_REF_TYPE" --ref-name "$GITHUB_REF_NAME" \
            --event-name "$GITHUB_EVENT_NAME" --sha "$GITHUB_SHA" --before "$BEFORE" \
            --platform "$PLATFORM" --version "$NAMED" --suite "$SUITE" --repo "$GITHUB_REPOSITORY" \
            --targets launcher/internal/payload/targets.json --output "$GITHUB_OUTPUT"

  # The unit tests and the lint read no built file, so they start with the builds.
  unit:
    name: Unit tests (${{ matrix.system }})
    needs: gate
    if: needs.gate.outputs.unit != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.gate.outputs.unit) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Run the Go unit tests
        run: bash build/test/go-tests.sh ${{ matrix.system != 'linux' && 'test' || '' }}

      - name: Run the Python unit tests
        if: matrix.system == 'linux'
        run: bash build/test/unit-tests.sh

      # govulncheck reads the vulnerability database when it runs, so a candidate
      # fails once a reported vulnerability reaches the code or the pinned Go. A new
      # advisory turns red only the runs QA also covers.
      - name: Check the Go modules for vulnerabilities
        if: matrix.system == 'linux' && github.event.repository.fork == false && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.platform == 'all'))
        run: |
          GOBIN=$RUNNER_TEMP go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          for module in $(git ls-files '*/go.mod'); do
            for goos in linux darwin windows; do
              (cd "$(dirname -- "$module")" && GOOS=$goos "$RUNNER_TEMP/govulncheck" ./...)
            done
          done

  # A builder image carries the PHP its own build compiled, so one image serves
  # one libc on one architecture. Its content follows the inputs
  # runtime/builder/builder-tag.sh digests, and the registry holds it under that digest.
  # install.ps1 installs the amd64 build on Windows on Arm too, which runs it under the
  # system's x64 emulation, so one Windows runtime serves both Windows hosts.
  runtime:
    name: ${{ matrix.name }}
    needs: [gate, unit]
    if: needs.gate.outputs.runtime != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    # static-php-cli and the sources it fetches run in this job, so its token
    # cannot write packages. image pushes the builder images this job builds.
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.gate.outputs.runtime) }}
    steps:
      - uses: actions/checkout@v7
      - if: matrix.system == 'linux'
        uses: ./.github/actions/runtime-linux
        with:
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          libc: ${{ matrix.libc }}
          builder: ${{ matrix.builder }}
          version: ${{ needs.gate.outputs.version }}
      - if: matrix.system == 'macos'
        uses: ./.github/actions/runtime-macos
        with:
          target: ${{ matrix.target }}
          version: ${{ needs.gate.outputs.version }}
          go-version: ${{ env.GO_VERSION }}
      - if: matrix.system == 'windows'
        uses: ./.github/actions/runtime-windows
        with:
          target: ${{ matrix.target }}
          version: ${{ needs.gate.outputs.version }}
          go-version: ${{ env.GO_VERSION }}

  # Every run pushes the job image under the commit for build.yml; publish names it
  # after the version. This job also pushes each builder image the runtime job built,
  # before it runs any build output. Loading and pushing an image runs no code from
  # it, and this job names each image itself, so a loaded archive can push under no
  # other name. It runs no site code: a site build runs Composer plugins and scripts.
  image:
    name: image
    needs: [gate, runtime]
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The later steps run the runtime in containers that mount workspace folders, so this
      # step runs first, before any build output runs, and logs out when done. A leg
      # that built nothing uploaded no artifact.
      - name: Push the builder images
        if: github.event.repository.fork == false
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME: ${{ needs.gate.outputs.runtime }}
        # After docker load, docker uploads a layer before it learns ghcr holds it.
        # One lane per architecture runs in parallel, so a lane's second image
        # finds the base layers its first image pushed.
        run: |
          push_lane() {
            local arch=$1
            jq -r --arg arch "$arch" '.[] | select(.system == "linux" and .arch == $arch) | "\(.libc) \(.builder)"' <<<"$RUNTIME" | while read -r libc builder; do
              name=builder-linux-$arch-$libc
              id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$name" --jq '.artifacts[0].id // empty')
              if [ -z "$id" ]; then
                echo "$name: no image built"
                continue
              fi
              case $arch in
                amd64) machine=x86_64 ;;
                arm64) machine=aarch64 ;;
                *) echo "$name: no machine type for $arch" >&2; exit 1 ;;
              esac
              image=ghcr.io/$GITHUB_REPOSITORY-builder:$(bash runtime/builder/builder-tag.sh "$builder" "$machine")
              gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" >"$RUNNER_TEMP/$name.zip"
              unzip -q "$RUNNER_TEMP/$name.zip" -d "$RUNNER_TEMP/$name"
              zstd -dc "$RUNNER_TEMP/$name/image.tar.zst" | docker load
              docker push "$image"
            done
          }
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          arches=()
          pids=()
          for arch in $(jq -r '[.[] | select(.system == "linux").arch] | unique[]' <<<"$RUNTIME"); do
            push_lane "$arch" >"$RUNNER_TEMP/push-$arch.log" 2>&1 &
            arches+=("$arch")
            pids+=($!)
          done
          status=0
          for i in "${!pids[@]}"; do
            wait "${pids[$i]}" || status=1
            echo "::group::${arches[$i]} images"
            cat "$RUNNER_TEMP/push-${arches[$i]}.log"
            echo "::endgroup::"
          done
          docker logout ghcr.io
          exit "$status"

      - uses: actions/download-artifact@v8
        with:
          pattern: runtime-linux-*
          path: runtime-artifacts

      - uses: actions/download-artifact@v8
        with:
          pattern: runtime-components-linux-*
          path: runtime-components
          merge-multiple: true

      # The Linux runtime legs' exports stand in for the runtimes stage, so no builder
      # image is pulled here. A run of every platform built all four.
      - name: Build the job image
        env:
          DRUPACK_ENGINE_VERSION: ${{ needs.gate.outputs.version }}
          RUNTIME: ${{ needs.gate.outputs.runtime }}
        run: |
          mkdir runtimes
          # download-artifact extracts a lone match straight into its path, with no
          # directory named after it, so the gate's one runtime names that directory.
          if [ -d runtime-artifacts/out ]; then
            lone=$(jq -r 'map(select(.system == "linux"))[0] | "runtime-linux-\(.arch)-\(.libc)"' <<<"$RUNTIME")
            mkdir "runtime-artifacts/$lone"
            mv runtime-artifacts/out "runtime-artifacts/$lone/out"
          fi
          for artifact in runtime-artifacts/runtime-linux-*; do
            target=${artifact#runtime-artifacts/runtime-}
            mv "$artifact/out" "runtimes/$target"
          done
          chmod +x runtimes/*/drupack
          ls runtimes
          docker build --target job --build-arg RUNTIMES=release-runtimes --build-context release-runtimes=runtimes \
            --build-arg RUNTIME_COMPONENTS=release-runtime-components \
            --build-context release-runtime-components=runtime-components \
            --build-arg "DRUPACK_ENGINE_VERSION=$DRUPACK_ENGINE_VERSION" -t drupack-job .

      # A main push and a tag push of one commit run at once. A release's image is
      # sha-COMMIT and a main run pushes dev-COMMIT, so a main run never replaces it.
      # Another run of this commit can push dev-COMMIT again, so the variant job pulls
      # this run's image by digest.
      - name: Push the job image under this commit
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_TAGS: ${{ needs.gate.outputs.image_tags }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for prefix in $IMAGE_TAGS; do
            docker tag drupack-job "ghcr.io/$GITHUB_REPOSITORY-build:$prefix-$GITHUB_SHA"
            docker push "ghcr.io/$GITHUB_REPOSITORY-build:$prefix-$GITHUB_SHA"
          done
          printf 'image=%s\n' "$(docker inspect --format '{{index .RepoDigests 0}}' drupack-job)" >>"$GITHUB_OUTPUT"

      - name: Export the engine payload
        run: |
          mkdir -p dist/engine
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/dist/engine:/out" drupack-job \
            drupack-build --engine-executable --payload-only --output /out

      - uses: actions/upload-artifact@v7
        with:
          name: engine-payload
          path: dist/engine/payload
          if-no-files-found: error

  # A candidate's Drupacked Demo run, which build.yml can only take from a run at the
  # candidate's commit: its job image follows the calling run's commit. The demo
  # reports alone, so a failed dispatch leaves the candidate green.
  demo:
    needs: image
    if: inputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      actions: write
    steps:
      - name: Start the demo build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site-build.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"

  # One leg per target packs the engine executable on that target's runtimes, from the
  # payload the image job exported, and runs each file it packs. The engine start case
  # needs the fixture's application, so the test rows run it.
  engine:
    name: Engine ${{ matrix.target }}
    needs: [gate, image, runtime]
    if: needs.gate.outputs.build == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.gate.outputs.engine) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - uses: actions/download-artifact@v8
        with:
          name: engine-payload
          path: engine-payload

      # A Linux target packs one file per libc.
      - uses: actions/download-artifact@v8
        if: runner.os == 'Linux'
        with:
          name: runtime-${{ matrix.target }}-glibc
          path: runtime-glibc

      - uses: actions/download-artifact@v8
        if: runner.os == 'Linux'
        with:
          name: runtime-${{ matrix.target }}-musl
          path: runtime-musl

      - uses: actions/download-artifact@v8
        if: runner.os != 'Linux'
        with:
          name: runtime-${{ matrix.target }}
          path: runtime

      - name: Pack and run the engine executable
        working-directory: launcher
        env:
          CGO_ENABLED: '0'
          DRUPACK_ENGINE_VERSION: ${{ needs.gate.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          pack() {
            go run ./cmd/pack -engine -target "$1" -runtime "$2" -payload ../engine-payload \
              -version "$DRUPACK_ENGINE_VERSION" -output "$3"
            "$3" --version
          }
          case $RUNNER_OS in
            Linux) pack "$TARGET" ../runtime-glibc/out ../dist/drupack && pack "$TARGET-musl" ../runtime-musl/out ../dist/musl/drupack ;;
            Windows) pack "$TARGET" ../runtime ../dist/drupack.exe ;;
            *) pack "$TARGET" ../runtime ../dist/drupack ;;
          esac

      - name: Check the unsigned launch steps
        if: runner.os == 'macOS'
        run: |
          cp dist/drupack "$RUNNER_TEMP/quarantined"
          xattr -w com.apple.quarantine "0081;$(printf '%x' "$(date +%s)");Safari;" "$RUNNER_TEMP/quarantined"
          xattr -d com.apple.quarantine "$RUNNER_TEMP/quarantined"
          "$RUNNER_TEMP/quarantined" --version

      - uses: actions/upload-artifact@v7
        with:
          name: drupack-${{ matrix.target }}
          path: dist/drupack${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: drupack-${{ matrix.target }}-musl
          path: dist/musl/drupack
          if-no-files-found: error

  # The fixture site goes through build.yml, the workflow site repositories call, on this
  # run's job image and runtimes. Each file it packs runs the start cases.
  site:
    needs: [gate, image, runtime]
    if: needs.gate.outputs.build == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build.yml
    with:
      site: tests/fixture-site
      platforms: ${{ needs.gate.outputs.platforms }}
      libc: both
      run-runtimes: true
      suite: smoke

  # The variant fixture adds a Mercure hub and project Caddy rules to a copy of the
  # fixture. The macOS and Windows test rows pack its payload and run those cases.
  variant:
    needs: [gate, image]
    if: contains(needs.gate.outputs.platforms, 'macos-') || contains(needs.gate.outputs.platforms, 'windows-')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # composer install runs the variant site's plugins and scripts. The container
      # holds no runner token and mounts the site read-only and one output folder.
      - name: Export the variant fixture payload
        env:
          IMAGE: ${{ needs.image.outputs.image }}
        run: |
          bash build/test/variant-fixture.sh tests/fixture-site "$RUNNER_TEMP/variant-site"
          mkdir -p dist/variant
          docker run --rm --user "$(id -u):$(id -g)" -v "$RUNNER_TEMP/variant-site:/variant-site:ro" -v "$PWD/dist/variant:/out" "$IMAGE" \
            drupack-build --site /variant-site --payload-only --output /out

      - uses: actions/upload-artifact@v7
        with:
          name: variant-payload
          path: dist/variant/payload
          if-no-files-found: error

  # Each row runs one share of the suite, or the start cases, on the files the site and
  # engine jobs packed. Emulation doubles each case's time, so Windows on Arm runs the
  # variant cases in a row of their own.
  test:
    name: ${{ matrix.name }}
    needs: [gate, engine, site, variant]
    # A Linux-only plan skips variant. A cancelled runtime leg skips engine and site,
    # which !failure() lets through, so their results are named.
    if: >-
      ${{ !cancelled() && needs.engine.result == 'success' && needs.site.result == 'success'
      && (needs.variant.result == 'success' || needs.variant.result == 'skipped') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.gate.outputs.tests) }}
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7

      # The suite packs its fixture launchers with Go.
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      # It holds site.json and the Linux files.
      - uses: actions/download-artifact@v8
        with:
          name: executables
          path: dist

      - uses: actions/download-artifact@v8
        if: ${{ !startsWith(matrix.target, 'linux-') }}
        with:
          name: executable-${{ matrix.target }}
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: drupack-${{ matrix.target }}
          path: dist/engine

      - uses: actions/download-artifact@v8
        if: matrix.first
        with:
          name: drupack-${{ matrix.target }}-musl
          path: dist/engine/musl

      # An artifact keeps no file mode.
      - name: Name the files
        run: |
          extension='' python=python3
          if [ "$RUNNER_OS" = Windows ]; then extension=.exe python=python; fi
          chmod -R +x dist
          printf 'EXECUTABLE=dist/%s-%s%s\nDRUPACK_TEST_ENGINE=dist/engine/drupack%s\nEXTENSION=%s\nPYTHON=%s\n' \
            "$(jq -r .name dist/site.json)" "$TARGET" "$extension" "$extension" "$extension" "$python" >>"$GITHUB_ENV"

      - name: Run the conformance suite
        if: matrix.smoke || matrix.shard != ''
        env:
          DRUPACK_SHARD: ${{ matrix.shard }}
          DRUPACK_SUITE: ${{ matrix.smoke && 'smoke' || 'full' }}
        run: $PYTHON tests/conformance "$EXECUTABLE" test-results/conformance --site-tests tests/fixture-site/tests

      - name: Check each Linux file's runtime and size
        if: matrix.first
        run: |
          set -eu
          for file in "$EXECUTABLE" dist/engine/drupack; do
            "$file" --version | grep ', glibc)$'
          done
          for file in "$EXECUTABLE-musl" dist/engine/musl/drupack; do
            "$file" --version | grep ', musl)$'
          done
          for file in "$EXECUTABLE" "$EXECUTABLE-musl" dist/engine/drupack dist/engine/musl/drupack; do
            printf '%s: %d MB\n' "$file" "$(( $(stat -c %s "$file") / 1000000 ))"
          done

      - name: Start a SQLite site on a musl host
        if: matrix.first
        run: |
          docker run -d --name alpine-site --network none \
            --mount type=bind,src="$PWD/$EXECUTABLE-musl",dst=/usr/local/bin/fixture,readonly \
            alpine@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d \
            fixture --foreground --data-dir /tmp/site --admin-user alpine-admin --admin-password Alpine.check.password.2026
          for _ in $(seq 1 60); do
            if docker exec alpine-site wget -q -O /dev/null http://127.0.0.1:7225/user/login 2>/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs alpine-site
          exit 1

      - uses: actions/download-artifact@v8
        if: matrix.variant
        with:
          name: runtime-${{ matrix.target }}
          path: runtime

      - uses: actions/download-artifact@v8
        if: matrix.variant
        with:
          name: variant-payload
          path: variant-payload

      - name: Run the variant fixture cases
        if: matrix.variant
        env:
          DRUPACK_ENGINE_VERSION: ${{ needs.gate.outputs.version }}
        run: |
          mkdir -p dist/variant
          (cd launcher && go run ./cmd/pack -target "$TARGET" -runtime ../runtime -payload ../variant-payload \
            -version "$DRUPACK_ENGINE_VERSION" -output "../dist/variant/variant-fixture$EXTENSION")
          cp variant-payload/site.json dist/variant/site.json
          $PYTHON tests/conformance "dist/variant/variant-fixture$EXTENSION" test-results/variant -k Node -k MercureHub -k ProjectRules

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-release-${{ matrix.results }}
          # The folder also holds each case's project, about 2 GB over 400,000 files.
          path: |
            test-results/**/*.log
            test-results/**/run.out
            test-results/**/run.err

  qa:
    name: QA
    needs: [gate, image]
    # A fork pushes no builder image, and the fixture phase pulls one.
    if: github.event.repository.fork == false && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.platform == 'all'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        phase: [fixture, variant, host]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      # runtime/frankenphp/adapt-test.sh, which the fixture phase runs, works in the glibc builder
      # image that the image job of this run published under its digest tag.
      - name: Pull the glibc builder image
        if: matrix.phase == 'fixture'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image=ghcr.io/$GITHUB_REPOSITORY-builder:$(bash runtime/builder/builder-tag.sh gnu)
          docker pull -q "$image"
          docker tag "$image" drupack-builder-gnu:local

      - uses: actions/download-artifact@v8
        with:
          pattern: runtime-linux-amd64-*
          path: ${{ runner.temp }}/runtime-artifacts

      # The job image takes the runtime legs' files. A build from the builder images
      # took 4 minutes after a 5 minute pull.
      - name: Run build/test/qa.sh
        env:
          PHASE: ${{ matrix.phase }}
          DRUPACK_ENGINE_VERSION: ${{ needs.gate.outputs.version }}
          DRUPACK_QA_RUNTIMES: ${{ runner.temp }}/runtimes
        run: |
          set -o pipefail
          mkdir "$DRUPACK_QA_RUNTIMES"
          for libc in musl glibc; do
            mv "$RUNNER_TEMP/runtime-artifacts/runtime-linux-amd64-$libc/out" "$DRUPACK_QA_RUNTIMES/linux-amd64-$libc"
          done
          chmod +x "$DRUPACK_QA_RUNTIMES"/*/drupack
          bash build/test/qa.sh "$PHASE" 2>&1 | tee "$RUNNER_TEMP/qa.log"

      - name: Summarize the QA
        if: always()
        env:
          PHASE: ${{ matrix.phase }}
        run: |
          {
            printf '### build/test/qa.sh %s\n\n```\n' "$PHASE"
            grep -E '^(Ran |OK|FAILED|ok |FAIL)' "$RUNNER_TEMP/qa.log" || true
            printf '```\n'
          } >>"$GITHUB_STEP_SUMMARY"
          # A phase keeps its builds' test results, so its log shows the room left.
          df -h /

      # build/test/qa.sh works under /tmp/drupack-qa, one folder per checkout name.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-qa-${{ matrix.phase }}
          path: |
            /tmp/drupack-qa/**/*.log
            /tmp/drupack-qa/**/run.out
            /tmp/drupack-qa/**/run.err

  # A tag run that publishes its candidate's files skips every build job.
  # syft and the action run in a job of their own, whose token writes nothing.
  # The scans read the downloaded folders as they land: the merge keeps each
  # component's name, version and identifiers, never its file path.
  sbom:
    needs: [gate, engine, test]
    # A tag that reuses its candidate builds and tests nothing here. A tag that builds
    # needs every test row green: a cancelled leg skips test, which !failure() lets through.
    if: >-
      ${{ !cancelled() && !failure() && github.ref_type == 'tag'
      && (needs.gate.outputs.candidate != '' || needs.test.result == 'success') }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      # download-artifact reads another run only when it has a token, and its own
      # run when the token is empty.
      - uses: actions/download-artifact@v8
        with:
          pattern: drupack-*
          path: candidates
          run-id: ${{ needs.gate.outputs.candidate || github.run_id }}
          github-token: ${{ needs.gate.outputs.candidate && github.token || '' }}

      - uses: actions/download-artifact@v8
        with:
          name: runtime-macos-arm64
          path: runtimes/runtime-macos-arm64
          run-id: ${{ needs.gate.outputs.candidate || github.run_id }}
          github-token: ${{ needs.gate.outputs.candidate && github.token || '' }}

      - uses: actions/download-artifact@v8
        with:
          name: runtime-windows-amd64
          path: runtimes/runtime-windows-amd64
          run-id: ${{ needs.gate.outputs.candidate || github.run_id }}
          github-token: ${{ needs.gate.outputs.candidate && github.token || '' }}

      - name: Make the scans folder
        run: mkdir "$RUNNER_TEMP/scans"

      # syft reads the launcher's Go modules from the executables, and FrankenPHP's
      # from the macOS and Windows runtimes. upload-artifact is off: the action's
      # own artifact, drupack-sbom.cyclonedx.json, would match the drupack-*
      # download above on a rerun of this job.
      - name: Scan the executables
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: candidates
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/scans/executables.cdx.json
          upload-artifact: false

      - name: Scan the runtimes
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: runtimes
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/scans/runtimes.cdx.json
          upload-artifact: false

      - uses: actions/upload-artifact@v7
        with:
          name: sbom-scans
          path: ${{ runner.temp }}/scans
          if-no-files-found: error

  publish:
    needs: [gate, unit, sbom]
    # A tag run that skipped sbom publishes nothing.
    if: ${{ !cancelled() && !failure() && github.ref_type == 'tag' && needs.sbom.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      # download-artifact reads another run only when it has a token, and its own
      # run when the token is empty.
      - uses: actions/download-artifact@v8
        with:
          pattern: drupack-*
          path: candidates
          run-id: ${{ needs.gate.outputs.candidate || github.run_id }}
          github-token: ${{ needs.gate.outputs.candidate && github.token || '' }}

      # A tag's files come from a run of every platform, so each macOS runtime lands
      # in a directory named after its artifact. A lone match would land in the path
      # itself, hence the Windows runtime's own step.
      - uses: actions/download-artifact@v8
        with:
          name: runtime-macos-arm64
          path: runtimes/runtime-macos-arm64
          run-id: ${{ needs.gate.outputs.candidate || github.run_id }}
          github-token: ${{ needs.gate.outputs.candidate && github.token || '' }}

      - uses: actions/download-artifact@v8
        with:
          name: runtime-windows-amd64
          path: runtimes/runtime-windows-amd64
          run-id: ${{ needs.gate.outputs.candidate || github.run_id }}
          github-token: ${{ needs.gate.outputs.candidate && github.token || '' }}

      - uses: actions/download-artifact@v8
        with:
          pattern: runtime-components-*
          path: runtime-components
          merge-multiple: true
          run-id: ${{ needs.gate.outputs.candidate || github.run_id }}
          github-token: ${{ needs.gate.outputs.candidate && github.token || '' }}

      # Each artifact is NAME-TARGET holding one file, NAME or NAME.exe. The loop
      # names each file NAME-TARGET, keeping .exe, as release-files.py reads it.
      - name: Write the release files
        run: |
          mkdir built
          for candidate in candidates/*/*; do
            directory=${candidate%/*}
            file=${candidate##*/}
            cp "$candidate" "built/${directory##*/}${file#"${file%.exe}"}"
          done
          runtimes=()
          for runtime in runtimes/*; do
            runtimes+=(--runtime "$runtime")
          done
          python3 build/release/release-files.py --output release --version "$VERSION" \
            --base-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$VERSION" \
            --commit "$GITHUB_SHA" "${runtimes[@]}" built/*

      - uses: actions/download-artifact@v8
        with:
          name: sbom-scans
          path: ${{ runner.temp }}/scans

      # Each runtime's report names what the executables carry compressed. A site
      # build reads the macOS and Windows reports from runtime-components.json.
      - name: Write the SBOM
        run: |
          python3 build/release/sbom.py merge --name drupack --version "$VERSION" \
            --runtime-components runtime-components/*.json --output release/drupack.cdx.json \
            "$RUNNER_TEMP/scans/executables.cdx.json" "$RUNNER_TEMP/scans/runtimes.cdx.json"
          jq -s add runtime-components/*.json >release/runtime-components.json

      - name: Attest the release files
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release/*

      # Site builds pull the job image by the engine's version.
      - name: Name the job image after the version
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create --tag "ghcr.io/$GITHUB_REPOSITORY-build:$VERSION" \
            "ghcr.io/$GITHUB_REPOSITORY-build:sha-$GITHUB_SHA"

      # GitHub refuses github.token a release whose commit differs from main in
      # .github/workflows, which happens once main moves during a tag run.
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
        run: |
          # The pins the tag's upstream run moved open the notes. A tag with none gives an
          # empty file, and gh then sends the generated notes alone.
          python3 build/release/release-node.py upgrades "$VERSION" >"$RUNNER_TEMP/upgrades.md"
          gh release create "$VERSION" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Drupack $VERSION" \
            --notes-file "$RUNNER_TEMP/upgrades.md" \
            --generate-notes
