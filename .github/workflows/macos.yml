name: macOS

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: Release candidate version
        required: false
        type: string

permissions:
  contents: read

jobs:
  app-archive:
    name: Application archive
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Build the shared application archive
        run: |
          docker build --target build -t drupack-app-archive .
          container=$(docker create drupack-app-archive)
          docker cp "$container:/go/src/app/app.tar" app.tar
          docker rm "$container"
          tar -tf app.tar >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: drupack-app-archive
          path: app.tar
          if-no-files-found: error

  release-candidate:
    name: macOS ${{ matrix.architecture }}
    needs: app-archive
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-14
          - architecture: amd64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: drupack-app-archive
          path: build-input

      - name: Prepare the embedded application
        run: |
          mkdir embedded-app
          tar -xf build-input/app.tar -C embedded-app
          test -f embedded-app/launch.php
          cp packaging/entrypoint.go embedded-app/drupack.go

      - name: Build with FrankenPHP static build script
        env:
          FRANKENPHP_VERSION: 1.12.7
          MACOSX_DEPLOYMENT_TARGET: '13.0'
          PHP_VERSION: 8.5.10
          PHP_EXTENSIONS: ctype,curl,dom,exif,fileinfo,filter,gd,iconv,intl,mbregex,mbstring,mysqli,mysqlnd,opcache,openssl,password-argon2,pcntl,pdo,pdo_mysql,pdo_pgsql,pdo_sqlite,phar,session,simplexml,sodium,tokenizer,xml,xmlreader,xmlwriter,zip,zlib
          PHP_EXTENSION_LIBS: brotli,watcher,freetype,libjpeg,libwebp,libavif
        run: |
          brew install autoconf automake bison re2c pkg-config
          git clone --depth 1 --branch "v${FRANKENPHP_VERSION}" https://github.com/php/frankenphp.git frankenphp
          cp packaging/entrypoint.go frankenphp/caddy/frankenphp/drupack.go
          EMBED="$PWD/embedded-app" frankenphp/build-static.sh
          mkdir -p dist
          cp "frankenphp/dist/frankenphp-mac-$(uname -m)" dist/drupack

      - name: Verify executable metadata
        run: |
          test -x dist/drupack
          file dist/drupack | grep -F "$(uname -m)"
          minimum=$(vtool -show-build dist/drupack | awk '/minos/ {print $2; exit}')
          case "$minimum" in
            [1-9].*|1[0-3].*) ;;
            *) printf 'macOS deployment target exceeds 13: %s\n' "$minimum" >&2; exit 1 ;;
          esac
          dist/drupack version
          dist/drupack --help

      - name: Test seeded site
        run: python3 tests/browser.py dist/drupack test-results/browser

      - name: Package release candidate
        id: package
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="$INPUT_VERSION"
          if [ -z "$version" ]; then
            version="0.0.0-dev-${GITHUB_SHA::12}"
          fi
          base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${version}"
          bash packaging/release/package-artifact.sh \
            dist/drupack "$version" "$base_url" release-candidate macos "${{ matrix.architecture }}"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: drupack-${{ steps.package.outputs.version }}-macos-${{ matrix.architecture }}
          path: release-candidate
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.architecture }}-test-results
          path: test-results
          if-no-files-found: warn
