name: 'No Results'
description: 'Contains the block elements used to render content when no query results are found.'
status: stable
group: 'WordPress: theme'
links:
  - 'https://github.com/WordPress/wordpress-develop/tree/trunk/src/wp-includes/blocks/query-no-results'
props:
  type: object
