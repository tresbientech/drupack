name: 'Author (deprecated)'
description: 'This block is deprecated. Please use the Avatar block, the Author Name block, and the Author Biography block instead.'
status: stable
group: 'WordPress: theme'
links:
  - 'https://github.com/WordPress/wordpress-develop/tree/trunk/src/wp-includes/blocks/post-author'
props:
