name: 'Query Loop'
description: 'An advanced block that allows displaying post types based on different query parameters and visual configurations.'
status: stable
group: 'WordPress: theme'
links:
  - 'https://github.com/WordPress/wordpress-develop/tree/trunk/src/wp-includes/blocks/query'
slots:
  content:
    title: Content
props:
  type: object
  properties:
    query_id:
      title: 'Query id'
      type: number
      x-wordpal-panel: settings
    tag_name:
      title: 'Tag name'
      type: string
      enum:
        - div
        - header
        - main
        - section
        - article
        - aside
        - footer
        - nav
      'meta:enum':
        div: 'Default (<div>)'
        header: '<header>'
        main: '<main>'
        section: '<section>'
        article: '<article>'
        aside: '<aside>'
        footer: '<footer>'
        nav: Nav
      examples:
        - div
      x-wordpal-panel: settings
    namespace:
      title: Namespace
      type: string
      x-wordpal-panel: settings
    enhanced_pagination:
      title: 'Enhanced pagination'
      type: boolean
      examples:
        - false
      x-wordpal-panel: settings
    align:
      title: Align
      type: string
      enum:
        - wide
        - full
      'meta:enum':
        wide: 'Wide width'
        full: 'Full width'
      x-wordpal-panel: settings
    anchor:
      title: Anchor
      type: string
      x-wordpal-panel: advanced
    css_class:
      title: 'CSS class'
      type: string
      x-wordpal-panel: advanced
    layout_type:
      title: 'Layout type'
      type: string
      enum:
        - default
        - constrained
        - flex
        - grid
      'meta:enum':
        default: Flow
        constrained: Constrained
        flex: Flex
        grid: Grid
      x-wordpal-panel: layout
    justify_content:
      title: 'Justify content'
      type: string
      enum:
        - left
        - center
        - right
        - space-between
        - stretch
      'meta:enum':
        left: 'Justify items left'
        center: 'Justify items center'
        right: 'Justify items right'
        space-between: 'Space between items'
        stretch: Stretch
      x-wordpal-panel: layout
    orientation:
      title: Orientation
      type: string
      enum:
        - horizontal
        - vertical
      'meta:enum':
        horizontal: Horizontal
        vertical: Vertical
      x-wordpal-panel: layout
    flex_wrap:
      title: 'Flex wrap'
      type: string
      enum:
        - wrap
        - nowrap
      'meta:enum':
        wrap: Wrap
        nowrap: Nowrap
      x-wordpal-panel: layout
    vertical_alignment:
      title: 'Vertical alignment'
      type: string
      enum:
        - top
        - center
        - bottom
        - stretch
        - space-between
      'meta:enum':
        top: 'Align top'
        center: 'Align middle'
        bottom: 'Align bottom'
        stretch: 'Stretch to fill'
        space-between: 'Space between'
      x-wordpal-panel: layout
    content_size:
      title: 'Content size'
      type: string
      x-wordpal-panel: layout
    wide_size:
      title: 'Wide size'
      type: string
      x-wordpal-panel: layout
    column_count:
      title: 'Column count'
      type: integer
      x-wordpal-panel: layout
    minimum_column_width:
      title: 'Minimum column width'
      type: string
      x-wordpal-panel: layout
    self_stretch:
      title: 'Self stretch'
      type: string
      enum:
        - fit
        - fill
        - fixed
        - fixedNoShrink
      'meta:enum':
        fit: Fit
        fill: Grow
        fixed: Max
        fixedNoShrink: Fixed
      x-wordpal-panel: dimensions
    flex_size:
      title: 'Flex size'
      type: string
      x-wordpal-panel: dimensions
