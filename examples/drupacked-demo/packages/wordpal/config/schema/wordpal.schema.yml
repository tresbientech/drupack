    vocabulary: { type: string, label: Vocabulary }
    number_of_tags: { type: integer, label: 'Number of tags' }
    show_tag_counts: { type: boolean, label: 'Show tag counts' }
    smallest_font_size:
      type: string
      label: 'Smallest size'
      constraints:
        Regex:
          pattern: '/^\d+(?:\.\d+)?(?:px|pt|em|rem|%)$/'
    largest_font_size:
      type: string
      label: 'Largest size'
      constraints:
        Regex:
          pattern: '/^\d+(?:\.\d+)?(?:px|pt|em|rem|%)$/'
