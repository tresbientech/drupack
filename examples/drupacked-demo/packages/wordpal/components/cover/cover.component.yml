name: Cover
description: 'Add an image or video with a text overlay.'
status: stable
group: 'WordPress: media'
links:
  - 'https://github.com/WordPress/wordpress-develop/tree/trunk/src/wp-includes/blocks/cover'
slots:
  content:
    title: Content
props:
  type: object
  properties:
    image_width:
      title: 'Image width'
      type: integer
    image_height:
      title: 'Image height'
      type: integer
    url:
      title: URL
      type: string
      format: uri-reference
      x-wordpal-panel: content
    use_featured_image:
      title: 'Use featured image'
      type: boolean
      examples:
        - false
      x-wordpal-panel: settings
    id:
      title: Id
      type: number
      x-wordpal-panel: settings
    alt:
      title: Alt
      type: string
      x-wordpal-panel: settings
    has_parallax:
      title: 'Has parallax'
      type: boolean
      examples:
        - false
      x-wordpal-panel: settings
    is_repeated:
      title: 'Is repeated'
      type: boolean
      examples:
        - false
      x-wordpal-panel: settings
    dim_ratio:
      title: 'Dim ratio'
      type: number
      examples:
        - 100
      x-wordpal-panel: settings
    overlay_color:
      title: 'Overlay color'
      type: string
      x-wordpal-panel: settings
    custom_overlay_color:
      title: 'Custom overlay color'
      type: string
      x-wordpal-panel: settings
    is_user_overlay_color:
      title: 'Is user overlay color'
      type: boolean
      x-wordpal-panel: settings
    background_type:
      title: 'Background type'
      type: string
      examples:
        - image
      x-wordpal-panel: settings
    min_height:
      title: 'Min height'
      type: number
      x-wordpal-panel: settings
    min_height_unit:
      title: 'Min height unit'
      type: string
      x-wordpal-panel: settings
    gradient:
      title: Gradient
      type: string
      x-wordpal-panel: settings
    custom_gradient:
      title: 'Custom gradient'
      type: string
      x-wordpal-panel: settings
    content_position:
      title: 'Content position'
      type: string
      x-wordpal-panel: settings
    is_dark:
      title: 'Is dark'
      type: boolean
      examples:
        - true
      x-wordpal-panel: settings
    tag_name:
      title: 'Tag name'
      type: string
      enum:
        - div
        - header
        - main
        - section
        - article
        - aside
        - footer
        - nav
      'meta:enum':
        div: 'Default (<div>)'
        header: '<header>'
        main: '<main>'
        section: '<section>'
        article: '<article>'
        aside: '<aside>'
        footer: '<footer>'
        nav: Nav
      examples:
        - div
      x-wordpal-panel: settings
    size_slug:
      title: 'Size slug'
      type: string
      x-wordpal-panel: settings
    poster:
      title: Poster
      type: string
      x-wordpal-panel: settings
    align:
      title: Align
      type: string
      enum:
        - left
        - center
        - right
        - wide
        - full
      'meta:enum':
        left: 'Align left'
        center: 'Align center'
        right: 'Align right'
        wide: 'Wide width'
        full: 'Full width'
      x-wordpal-panel: settings
    in_template_part:
      title: 'In a Template part'
      type: boolean
      x-wordpal-panel: settings
    focal_point:
      title: 'Focal point'
      type: string
      x-wordpal-panel: settings
    anchor:
      title: Anchor
      type: string
      x-wordpal-panel: advanced
    css_class:
      title: 'CSS class'
      type: string
      x-wordpal-panel: advanced
    font_size:
      title: 'Font size'
      type: string
      x-wordpal-panel: typography
    line_height:
      title: 'Line height'
      type: string
      x-wordpal-panel: typography
    font_family:
