name: Release

on:
  push:
    branches:
      - main
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      platform:
        description: Target to build and test; a tag push always builds every platform.
        type: choice
        default: all
        options:
          - all
          - linux-amd64
          - linux-arm64
          - macos-arm64
          - macos-amd64
          - windows-amd64

permissions:
  contents: read

jobs:
  # What a run covers. A tag and a dispatch cover every platform, and a dispatch
  # can name one. A main push covers Linux amd64, and only when it touched
  # something an executable carries. GitHub leaves the effect of a path filter on
  # a tag push undocumented, so the comparison happens here rather than under `on:`.
  gate:
    name: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.targets.outputs.build }}
      version: ${{ steps.targets.outputs.version }}
      linux: ${{ steps.targets.outputs.linux }}
      linux_runtime: ${{ steps.targets.outputs.linux_runtime }}
      macos: ${{ steps.targets.outputs.macos }}
      windows: ${{ steps.targets.outputs.windows }}
    steps:
      - uses: actions/checkout@v7

      - id: targets
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          PLATFORM: ${{ inputs.platform || 'all' }}
        run: |
          # Every job that builds a runtime or packs one names the same version.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=$GITHUB_REF_NAME
          else
            version=dev-${SHA:0:12}
          fi
          linux='[]'
          macos='[]'
          windows='[]'
          if [ "$GITHUB_REF_TYPE" = tag ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            case "$PLATFORM" in
              all)
                linux='[{"arch":"amd64"},{"arch":"arm64"}]'
                macos='[{"arch":"arm64"},{"arch":"amd64"}]'
                windows='[{"arch":"amd64"}]'
                ;;
              linux-amd64) linux='[{"arch":"amd64"}]' ;;
              linux-arm64) linux='[{"arch":"arm64"}]' ;;
              macos-arm64) macos='[{"arch":"arm64"}]' ;;
              macos-amd64) macos='[{"arch":"amd64"}]' ;;
              windows-amd64) windows='[{"arch":"amd64"}]' ;;
            esac
          # A new branch reports an all-zero before, which compares against nothing.
          elif [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            linux='[{"arch":"amd64"}]'
          else
            # A comparison that fails reports no file, which would read as a
            # documentation commit and skip the build, so it fails the run first.
            files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" \
              --jq '.files[].filename')
            # Documentation reaches no executable. A path this list does not name
            # builds rather than skips, so a new directory never goes untested.
            changed=$(printf '%s\n' "$files" | grep -vE '^docs/|^LICENSE$|^[^/]+\.md$' || true)
            if [ -n "$changed" ]; then
              printf 'Building for:\n%s\n' "$changed"
              linux='[{"arch":"amd64"}]'
            else
              echo 'Documentation alone changed. Nothing to build.'
            fi
          fi
          # Each Linux architecture carries a runtime per C library.
          linux_runtime=$(jq -cn --argjson linux "$linux" \
            '[$linux[] | ({arch: .arch, libc: "musl"}, {arch: .arch, libc: "gnu"})]')
          # Every platform packs the payload job's output, so any target calls for it.
          build=true
          [ "$linux$macos$windows" != '[][][]' ] || build=false
          {
            printf 'version=%s\n' "$version"
            printf 'build=%s\n' "$build"
            printf 'linux=%s\n' "$linux"
            printf 'linux_runtime=%s\n' "$linux_runtime"
            printf 'macos=%s\n' "$macos"
            printf 'windows=%s\n' "$windows"
          } >>"$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      # Every builder compiles the extensions runtime/php-extensions.txt names, so
      # a lock that declares one the file omits stops the release here.
      - name: Check the allowlist against the lock
        run: python3 runtime/check-extensions.py examples/mercury-demo

  # A builder image carries the PHP its own build compiled, so one image serves
  # one libc on one architecture. Its content follows the inputs
  # runtime/builder-tag.sh digests, and the registry holds it under that digest.
  linux-runtime:
    name: Linux ${{ matrix.arch }} ${{ matrix.libc }} runtime
    needs: gate
    if: needs.gate.outputs.linux_runtime != '[]'
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.gate.outputs.linux_runtime) }}
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - id: builder
        name: Name the builder image
        env:
          LIBC: ${{ matrix.libc }}
        run: |
          tag=$(bash runtime/builder-tag.sh "$LIBC")
          printf 'image=ghcr.io/%s-builder:%s\n' "$GITHUB_REPOSITORY" "$tag" >>"$GITHUB_OUTPUT"

      - name: Log in to the registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # An image under this tag carries the PHP this run needs, whatever run built
      # it. build-static.sh reads the token to raise its GitHub API rate limit
      # while it downloads the PHP and extension sources.
      - id: image
        name: Pull or build the builder image
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.builder.outputs.image }}
          LIBC: ${{ matrix.libc }}
        run: |
          if docker pull -q "$IMAGE"; then
            exit 0
          fi
          bash runtime/build-builder.sh "$LIBC" "$IMAGE" "$RUNNER_TEMP/builder"
          echo 'built=true' >>"$GITHUB_OUTPUT"

      # A fork holds a read-only token. The image it built stays on the runner,
      # where the build below finds it under the same name.
      - name: Publish the builder image
        if: steps.image.outputs.built == 'true' && github.event.repository.fork == false
        env:
          IMAGE: ${{ steps.builder.outputs.image }}
        run: docker push "$IMAGE"

      - name: Build the runtime
        env:
          DRUPACK_VERSION: ${{ needs.gate.outputs.version }}
          IMAGE: ${{ steps.builder.outputs.image }}
          LIBC: ${{ matrix.libc }}
          BUILDER_ARG: ${{ matrix.libc == 'musl' && 'MUSL_BUILDER' || 'GNU_BUILDER' }}
        run: |
          docker build --target "runtime-$LIBC-files" \
            --build-arg "DRUPACK_VERSION=$DRUPACK_VERSION" \
            --build-arg "$BUILDER_ARG=$IMAGE" \
            --output "type=local,dest=runtime-$LIBC" .
          df -h /

      - uses: actions/upload-artifact@v7
        with:
          name: runtime-linux-${{ matrix.arch }}-${{ matrix.libc }}
          path: runtime-${{ matrix.libc }}
          if-no-files-found: error

  # The application is PHP source, vendor, translations and a seeded database.
  # None of it depends on a platform, so every executable packs this one build.
  payload:
    name: payload
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      # The runner starts with about 14 GB free, the builder image takes 8.6 GB.
      # Printing the free space tells a later failure apart from a full disk.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Export the application payload
        env:
          DRUPACK_VERSION: ${{ needs.gate.outputs.version }}
        run: |
          docker build --target app --build-arg "DRUPACK_VERSION=$DRUPACK_VERSION" -t drupack-build .
          container=$(docker create drupack-build)
          mkdir -p dist/payload
          docker cp "$container:/go/src/app/app-payload.tar" dist/payload/app-payload.tar
          docker cp "$container:/go/src/app/app_checksum.txt" dist/payload/app_checksum.txt
          docker rm "$container"

      - uses: actions/upload-artifact@v7
        with:
          name: payload-archive
          path: dist/payload
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    # GitHub waits on the whole linux-runtime matrix, so this architecture also
    # waits on the other one's two legs. With the builder images published every
    # leg finishes within a minute of the rest.
    needs: [gate, payload, linux-runtime]
    if: needs.gate.outputs.linux != '[]'
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.gate.outputs.linux) }}
    steps:
      - uses: actions/checkout@v7

      # setup-go sets GOTOOLCHAIN=local from v6 on, so go fetches no newer toolchain of
      # its own: this version must stay at or above the go line in launcher/go.mod.
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: false

      - name: Run the launcher unit tests
        working-directory: launcher
        run: go test ./...

      - uses: actions/download-artifact@v7
        with:
          name: runtime-linux-${{ matrix.arch }}-musl
          path: runtime-musl

      - uses: actions/download-artifact@v7
        with:
          name: runtime-linux-${{ matrix.arch }}-gnu
          path: runtime-gnu

      - uses: actions/download-artifact@v7
        with:
          name: payload-archive
          path: dist/payload

      # The runtimes are listed with the one needing a host loader first, which is
      # the order the launcher tries them in. The launcher itself carries no cgo,
      # so one file runs on a glibc and a musl host alike.
      - name: Pack the executable
        working-directory: launcher
        env:
          CGO_ENABLED: '0'
          DRUPACK_VERSION: ${{ needs.gate.outputs.version }}
        run: |
          chmod +x ../runtime-musl/out/drupack ../runtime-gnu/out/drupack
          mkdir -p ../dist
          go run ./cmd/pack -runtime glibc=../runtime-gnu/out -runtime musl=../runtime-musl/out \
            -entry drupack -version "$DRUPACK_VERSION" -source . -output ../dist/drupack \
            -app ../dist/payload/app-payload.tar -app-checksum ../dist/payload/app_checksum.txt

      - name: Run the harness unit tests
        run: python3 -m unittest discover -s tests/conformance -p 'test_harness.py'

      - name: Run the test scripts
        run: |
          python3 tests/conformance dist/drupack test-results/conformance

      # The executable carries a runtime per libc and picks one per host. This
      # runner has glibc, so the step above exercised the glibc runtime. Forcing
      # musl here covers the other runtime and the variable that selects it.
      - name: Start a site on the musl runtime
        run: |
          set -eu
          dist/drupack --version | grep -q 'glibc runtime'
          DRUPACK_LIBC=musl dist/drupack --version | grep -q 'musl runtime'
          if DRUPACK_LIBC=gnu dist/drupack --version; then
            echo 'An unknown DRUPACK_LIBC value was accepted' >&2
            exit 1
          fi
          DRUPACK_LIBC=musl dist/drupack --data-dir "$RUNNER_TEMP/musl-site" \
            --admin-user musl-admin --admin-password Musl.check.password.2026 --no-browser &
          for attempt in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:7225/user/login; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Start a SQLite site on a musl host
        run: |
          docker run -d --name alpine-site --network none \
            --mount type=bind,src="$PWD/dist/drupack",dst=/usr/local/bin/drupack,readonly \
            alpine@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d \
            drupack --data-dir /tmp/site --admin-user alpine-admin --admin-password Alpine.check.password.2026
          for attempt in $(seq 1 60); do
            if docker exec alpine-site wget -q -O /dev/null http://127.0.0.1:7225/user/login 2>/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs alpine-site
          exit 1

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-linux-${{ matrix.arch }}
          path: test-results

      - uses: actions/upload-artifact@v7
        with:
          name: drupack-linux-${{ matrix.arch }}
          path: dist/drupack
          if-no-files-found: error

  windows:
    name: Windows amd64
    needs: [gate, payload]
    if: needs.gate.outputs.windows != '[]'
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: false

      - name: Run the launcher unit tests
        working-directory: launcher
        run: go test ./...

      - uses: actions/download-artifact@v8
        with:
          name: payload-archive
          path: dist/payload

      - uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}\drupack\downloads
            ${{ runner.temp }}\drupack\vcpkg
            ~\AppData\Local\vcpkg\archives
            ~\go\pkg\mod
            ~\AppData\Local\go-build
          key: windows-build-${{ hashFiles('build/windows/build.ps1') }}

      - name: Build the executable
        env:
          DRUPACK_VERSION: ${{ needs.gate.outputs.version }}
        run: |
          ./build/windows/build.ps1 -PayloadDirectory dist\payload -Version $env:DRUPACK_VERSION -WorkDirectory "$env:RUNNER_TEMP\drupack" -Output dist\drupack.exe

      - name: Run the conformance suite
        run: python tests/conformance dist\drupack.exe test-results\conformance

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-windows-amd64
          path: test-results

      - uses: actions/upload-artifact@v7
        with:
          name: drupack-windows-amd64
          path: dist/drupack.exe
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    needs: [gate, payload]
    if: needs.gate.outputs.macos != '[]'
    runs-on: ${{ matrix.arch == 'arm64' && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.gate.outputs.macos) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: false

      - name: Run the launcher unit tests
        working-directory: launcher
        run: go test ./...

      - uses: actions/download-artifact@v8
        with:
          name: payload-archive
          path: dist/payload

      # The buildroot holds the PHP the allowlist names, so the list files belong
      # in the key beside the script that compiles them.
      - uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.temp }}/drupack/downloads
            ${{ runner.temp }}/drupack/buildroot
            ${{ runner.temp }}/drupack/pkgroot
          key: macos-${{ matrix.arch }}-${{ hashFiles('build/macos/build.sh', 'runtime/php-extensions.txt', 'runtime/php-extension-libs.txt') }}

      - name: Build the executable
        env:
          # static-php-cli reads library releases from the GitHub API, which rate-limits anonymous requests.
          GITHUB_TOKEN: ${{ github.token }}
          DRUPACK_VERSION: ${{ needs.gate.outputs.version }}
        run: bash build/macos/build.sh dist/payload "$RUNNER_TEMP/drupack" dist/drupack

      # Saved before the tests, so a failed test does not repeat the PHP build.
      - uses: actions/cache/save@v6
        with:
          path: |
            ${{ runner.temp }}/drupack/downloads
            ${{ runner.temp }}/drupack/buildroot
            ${{ runner.temp }}/drupack/pkgroot
          key: macos-${{ matrix.arch }}-${{ hashFiles('build/macos/build.sh', 'runtime/php-extensions.txt', 'runtime/php-extension-libs.txt') }}

      - name: Run the test scripts
        run: |
          python3 tests/conformance dist/drupack test-results/conformance

      - name: Check the unsigned launch steps
        run: |
          cp dist/drupack test-results/quarantined
          xattr -w com.apple.quarantine "0081;$(printf '%x' "$(date +%s)");Safari;" test-results/quarantined
          xattr -d com.apple.quarantine test-results/quarantined
          test-results/quarantined --help

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-macos-${{ matrix.arch }}
          path: test-results

      - uses: actions/upload-artifact@v7
        with:
          name: drupack-macos-${{ matrix.arch }}
          path: dist/drupack
          if-no-files-found: error

  publish:
    needs: [linux, windows, macos]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: drupack-*
          path: candidates

      - name: Name assets and write checksums.txt and release.json
        run: |
          mkdir release
          for candidate in candidates/drupack-*/drupack*; do
            directory=${candidate%/*}
            target=${directory#candidates/drupack-}
            asset="drupack-${VERSION}-${target}${candidate##*/drupack}"
            cp "$candidate" "release/$asset"
            chmod 0755 "release/$asset"
            # GitHub's latest-release URL resolves a fixed file name, so each
            # asset also ships without its version for a copy-and-paste download.
            latest="drupack-${target}${candidate##*/drupack}"
            cp "release/$asset" "release/$latest"
            sha256=$(sha256sum "release/$asset" | cut -d ' ' -f 1)
            printf '%s  %s\n' "$sha256" "$asset" >>release/checksums.txt
            printf '%s  %s\n' "$sha256" "$latest" >>release/checksums.txt
            jq -n \
              --arg asset "$asset" \
              --arg target "$target" \
              --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}/${asset}" \
              --arg latest_url "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/${latest}" \
              --arg sha256 "$sha256" \
              --argjson size "$(stat --format=%s "release/$asset")" \
              '{asset: $asset, target: $target, url: $url, latest_url: $latest_url, sha256: $sha256, size: $size}'
          done | jq -s --arg version "$VERSION" --arg commit "$GITHUB_SHA" \
            '{version: $version, build_commit: $commit, assets: .}' >release/release.json

      - name: Generate the SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: release/drupack.cdx.json

      - name: Attest the release files
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/*

      - name: Publish the GitHub Release
        run: |
          gh release create "$VERSION" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Drupack $VERSION" \
            --generate-notes
