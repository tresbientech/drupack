name: Avatar
description: 'Add a user’s avatar.'
status: stable
group: 'WordPress: theme'
links:
  - 'https://github.com/WordPress/wordpress-develop/tree/trunk/src/wp-includes/blocks/avatar'
props:
  type: object
  properties:
    author_id:
      title: Author
      type: integer
      examples:
        - 1
    size:
      title: Size
      type: number
      examples:
        - 96
      x-wordpal-panel: settings
    is_link:
      title: 'Is link'
      type: boolean
      examples:
        - false
      x-wordpal-panel: settings
    link_target:
      title: 'Link target'
      type: string
      examples:
        - _self
      x-wordpal-panel: settings
    align:
      title: Align
      type: string
      enum:
        - left
        - center
        - right
        - wide
        - full
      'meta:enum':
        left: 'Align left'
        center: 'Align center'
        right: 'Align right'
        wide: 'Wide width'
        full: 'Full width'
      x-wordpal-panel: settings
    anchor:
      title: Anchor
      type: string
      x-wordpal-panel: advanced
    css_class:
      title: 'CSS class'
      type: string
      x-wordpal-panel: advanced
    link_color:
      title: 'Link color'
      type: string
      x-wordpal-panel: color
    heading_color:
      title: 'Heading color'
      type: string
      x-wordpal-panel: color
    button_color:
      title: 'Button color'
      type: string
      x-wordpal-panel: color
    button_background_color:
      title: 'Button background color'
      type: string
      x-wordpal-panel: color
    duotone:
      title: Duotone
      type: string
      x-wordpal-panel: filter
      x-wordpal-duotone-selector: '.wp-block-avatar img'
    padding_top:
      title: 'Padding top'
      type: string
      x-wordpal-panel: dimensions
    padding_right:
      title: 'Padding right'
      type: string
      x-wordpal-panel: dimensions
    padding_bottom:
      title: 'Padding bottom'
      type: string
      x-wordpal-panel: dimensions
    padding_left:
      title: 'Padding left'
      type: string
      x-wordpal-panel: dimensions
    margin_top:
      title: 'Margin top'
      type: string
      x-wordpal-panel: dimensions
    margin_right:
      title: 'Margin right'
      type: string
      x-wordpal-panel: dimensions
    margin_bottom:
      title: 'Margin bottom'
      type: string
      x-wordpal-panel: dimensions
    margin_left:
      title: 'Margin left'
      type: string
      x-wordpal-panel: dimensions
    self_stretch:
      title: 'Self stretch'
      type: string
      enum:
        - fit
        - fill
        - fixed
        - fixedNoShrink
      'meta:enum':
        fit: Fit
        fill: Grow
        fixed: Max
        fixedNoShrink: Fixed
      x-wordpal-panel: dimensions
    flex_size:
      title: 'Flex size'
      type: string
      x-wordpal-panel: dimensions
    border_radius:
      title: 'Border radius'
      type: string
      x-wordpal-panel: border
    border_color:
      title: 'Border color'
      type: string
      x-wordpal-panel: border
    border_width:
      title: 'Border width'
      type: string
      x-wordpal-panel: border
    border_style:
      title: 'Border style'
      type: string
      enum:
        - none
        - solid
        - dashed
        - dotted
        - double
        - groove
        - ridge
        - inset
        - outset
      'meta:enum':
        none: None
        solid: Solid
        dashed: Dashed
        dotted: Dotted
        double: Double
        groove: Groove
        ridge: Ridge
        inset: Inset
        outset: Outset
      x-wordpal-options:
        - solid
        - dashed
        - dotted
      x-wordpal-panel: border
    border_top_width:
      title: 'Border top width'
      type: string
