# drupal.org's runners run the unit tests and ruff's security rules on a merge
# request, and one daily job that starts GitHub's workflows. GitHub's release.yml
# builds and tests the executables.

tests:
  image: golang:bookworm
  interruptible: true
  # build/test/go-tests.sh compiles golangci-lint on each run. The kept caches let a
  # later run reuse that build; a cache sits inside the checkout or not at all.
  variables:
    GOCACHE: $CI_PROJECT_DIR/.go/build
    GOMODCACHE: $CI_PROJECT_DIR/.go/mod
  cache:
    key:
      files:
        - build/test/go-tests.sh
        - launcher/go.sum
    paths:
      - .go/
  rules:
    # GitLab's changes takes no negation, so the list names every tracked path
    # outside docs/, LICENSE and the root Markdown files.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - .github/**/*
        - .gitlab-ci.yml
        - Dockerfile
        - application/**/*
        - build/**/*
        - ci/**/*
        - composer.json
        - composer/**/*
        - launcher/**/*
        - runtime/**/*
        - tests/**/*
  script:
    # build/release/release-files.py packs with zstd, and runtime/builder/check-downloads.php runs on PHP.
    - apt-get update --quiet --quiet && apt-get install --yes --quiet --quiet --no-install-recommends python3 zstd php-cli
    # go downloads the toolchain release.yml pins.
    - |
      export GOTOOLCHAIN="go$(sed -n "s/^  GO_VERSION: '\(.*\)'$/\1/p" .github/workflows/release.yml)"
    - bash build/test/go-tests.sh
    - bash build/test/unit-tests.sh

# ruff.toml lists the accepted hits, each with its reason.
ruff:
  image: python:3-slim
  interruptible: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "**/*.py"
        - .gitlab-ci.yml
        - ruff.toml
  script:
    - pip install --quiet --root-user-action=ignore ruff==0.15.10
    - ruff check .

# GitHub's cron starts late under load, so drupal.org's pipeline schedule is the
# clock. GITHUB_DISPATCH_TOKEN is a masked, protected CI/CD variable.
dispatch:
  image:
    name: curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
    entrypoint: [""]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - |
      for workflow in release-node.yml upstream.yml; do
        curl --fail --silent --show-error --retry 3 -X POST \
          -H "Authorization: Bearer $GITHUB_DISPATCH_TOKEN" -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/tresbientech/drupack/actions/workflows/$workflow/dispatches" -d '{"ref":"main"}'
      done
