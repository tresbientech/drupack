wordpal.theme_settings.*:
  type: config_object
  label: 'Converted WordPress theme settings'
  mapping:
    layout:
      type: mapping
      label: Layout
      mapping:
        wideSize:
          type: string
          label: 'Wide size'
    use_root_padding_aware_alignments:
      type: boolean
      label: 'Use root padding aware alignments'
    block_gap_support:
      type: boolean
      label: 'Block gap support'
    position:
      type: mapping
      label: 'Position types'
      mapping:
        sticky:
          type: boolean
          label: Sticky
        fixed:
          type: boolean
          label: Fixed
    duotone_filters:
      type: sequence
      label: 'Duotone preset filters'
      sequence:
        type: string
        label: 'SVG filter'
    block_gaps:
      type: sequence
      label: 'Block gap of each block type and style variation'
      sequence:
        type: ignore
        label: 'Block gap, a string or its top and left sides'
    root_block_gap:
      type: ignore
      label: 'Root block gap, a string or its top and left sides'
    button_widths:
      type: sequence
      label: 'Size of each dimension preset a Button width names'
      sequence:
        type: string
        label: Size
    typography:
      type: ignore
      label: Typography
    styled_variations:
      type: sequence
      label: 'Styled block variations'
      sequence:
        type: string
        label: 'Class of the block variation'
    registered_variations:
      type: sequence
      label: 'Registered block style variations'
      sequence:
        type: sequence
        label: 'Variation names of a block'
        sequence:
          type: string
          label: 'Variation name'
    body:
      type: mapping
      label: 'Body classes'
      mapping:
        classes:
          type: sequence
          label: 'Classes on every page'
          sequence:
            type: string
            label: Class
        bundles:
          type: sequence
          label: 'Template route of each node bundle'
          sequence:
            type: string
            label: 'single or page'
        vocabularies:
          type: sequence
          label: 'Class prefix of each vocabulary'
          sequence:
            type: string
            label: 'tag or category'
        search:
          type: mapping
          label: 'Search page'
          nullable: true
          mapping:
            path:
              type: string
              label: Path
            parameter:
              type: string
              label: 'Keywords parameter'
            index:
              type: string
              label: 'Search API index'

wordpal.block_supports:
  type: sequence
  label: 'Block supports'
  sequence:
    type: string
    label: 'Support value'

block.settings.wordpal_adjacent_post:
  type: block_settings
  label: 'WordPal adjacent post settings'
  constraints:
    FullyValidatable: ~
  mapping:
    direction:
      type: string
      label: Direction
    label:
      type: string
      label: Label
    show_title:
      type: boolean
      label: 'Show post title'
    link_label:
      type: boolean
      label: 'Link label'
    arrow:
      type: string
      label: Arrow
    supports:
      type: wordpal.block_supports
      label: 'Block supports'

