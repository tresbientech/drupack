wordpal_convert.conversion.*:
  type: config_object
  label: 'WordPal conversion ownership'
  mapping:
    target:
      type: string
      label: 'Builder target'
    page_entity_type:
      type: string
      label: 'Entity type id a home or 404 page saves as'
    entities:
      type: ignore
      label: 'Owned entity IDs'
    config:
      type: sequence
      label: 'Owned config objects'
      sequence:
        type: string
        label: 'Config name'
    full_displays:
      type: sequence
      label: 'Bundle full displays whose Display Builder sources are owned'
      sequence:
        type: string
        label: 'Entity view display config name'
    files:
      type: sequence
      label: 'Owned theme files'
      sequence:
        type: string
        label: Path
    pages:
      type: sequence
      label: 'Home and 404 page UUIDs by route'
      sequence:
        type: string
        label: 'Page UUID'
    demo_content:
      type: sequence
      label: 'Owned Demo content UUIDs by entity type'
      sequence:
        type: sequence
        label: 'Entity UUIDs'
        sequence:
          type: uuid
          label: UUID
    recipe:
      type: string
      label: 'Owned Site recipe directory name'
    replaced_views:
      type: sequence
      label: 'Site Views the conversion disabled'
      sequence:
        type: string
        label: 'View ID'
    wordpress_version:
      type: string
      label: 'WordPress version the snapshot ran'
    wordpal_version:
      type: string
      nullable: true
      label: 'WordPal release that converted the theme, or NULL from a git checkout'
