name: 'Wordpal Canvas'
type: module
description: 'Writes converted WordPress block themes into Drupal Canvas.'
package: 'WordPal'
core_version_requirement: ^11.4
dependencies:
  - wordpal:wordpal
  - wordpal:wordpal_convert
  - wordpal:wordpal_canvas_runtime
  - canvas:canvas
  - drupal:views
  - drupal:menu_link_content
test_dependencies:
  - wordpal:wordpal_evaluate
  - search_api:search_api
  - search_api:search_api_db
