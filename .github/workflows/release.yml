name: Release
# A tag run finds its candidate run by this name.
run-name: ${{ inputs.version != '' && inputs.platform == 'all' && format('Release candidate {0}', inputs.version) || '' }}

on:
  push:
    branches:
      - main
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      platform:
        description: Target to build and test; a tag push builds every platform unless its candidate run did.
        type: choice
        default: all
        options:
          - all
          - linux-amd64
          - linux-arm64
          - macos-arm64
          - macos-amd64
          - windows-amd64
      version:
        description: The version a forge candidate run builds, which its tag run then publishes.
        type: string
        default: ''

permissions:
  contents: read

env:
  # setup-go sets GOTOOLCHAIN=local from v6 on, so go fetches no newer toolchain of
  # its own: this version must stay at or above the go line in launcher/go.mod.
  GO_VERSION: '1.27.1'
  # Go moves to the next entry after a "|" on any error, so a module fetch the
  # proxy drops mid-stream gets a second attempt. go.sum checks either answer.
  GOPROXY: https://proxy.golang.org|https://proxy.golang.org,direct

jobs:
  # What a run covers. A tag whose candidate run succeeded builds nothing and
  # publishes that run's files. Any other tag, and a dispatch, cover every
  # platform, and a dispatch can name one. A main push covers Linux amd64, and only
  # when it touched something an executable carries. GitHub leaves the effect of a
  # path filter on a tag push undocumented, so the comparison happens here rather
  # than under `on:`.
  gate:
    name: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      build: ${{ steps.targets.outputs.build }}
      candidate: ${{ steps.targets.outputs.candidate }}
      image_tags: ${{ steps.targets.outputs.image_tags }}
      version: ${{ steps.targets.outputs.version }}
      linux: ${{ steps.targets.outputs.linux }}
      linux_runtime: ${{ steps.targets.outputs.linux_runtime }}
      macos: ${{ steps.targets.outputs.macos }}
      windows: ${{ steps.targets.outputs.windows }}
      demo_repository: ${{ steps.demo.outputs.repository }}
      demo_ref: ${{ steps.demo.outputs.ref }}
    steps:
      - uses: actions/checkout@v7

      - id: demo
        name: Name the demo commit
        run: |
          . build/demo-pin.sh
          printf 'repository=%s\nref=%s\n' "$demo_repository" "$demo_ref" >>"$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.demo.outputs.repository }}
          ref: ${{ steps.demo.outputs.ref }}
          path: demo
          persist-credentials: false

      - id: targets
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          PLATFORM: ${{ inputs.platform || 'all' }}
          NAMED: ${{ inputs.version }}
        run: |
          # Every job that builds a runtime or packs one names the same version.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=$GITHUB_REF_NAME
          elif [ -n "$NAMED" ]; then
            version=$NAMED
          else
            version=dev-${SHA:0:12}
          fi
          linux='[]'
          macos='[]'
          windows='[]'
          candidate=
          # The job image's tags: build.yml reads sha-COMMIT at a tag and dev-COMMIT
          # on a branch, and a tag run publishes its candidate's sha-COMMIT.
          image_tags=dev
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            image_tags=sha
          elif [ -n "$NAMED" ] && [ "$PLATFORM" = all ]; then
            image_tags='dev sha'
          fi
          # The forge tags the commit its candidate run built, under the same version.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            candidate=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?head_sha=$SHA&event=workflow_dispatch&status=success" \
              | jq -r --arg title "Release candidate $version" '[.workflow_runs[] | select(.display_title == $title)][0].id // empty')
          fi
          # Artifacts expire after 90 days, and a candidate without them is rebuilt.
          if [ -n "$candidate" ] && [ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate/artifacts?per_page=100" \
            --jq 'any(.artifacts[]; .expired)')" = true ]; then
            echo "The files of candidate run $candidate expired."
            candidate=
          fi
          if [ -n "$candidate" ]; then
            echo "Publishing the files of candidate run $candidate."
          elif [ "$GITHUB_REF_TYPE" = tag ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            case "$PLATFORM" in
              all)
                linux='[{"arch":"amd64"},{"arch":"arm64"}]'
                macos='[{"arch":"arm64"},{"arch":"amd64"}]'
                windows='[{"arch":"amd64"}]'
                ;;
              linux-amd64) linux='[{"arch":"amd64"}]' ;;
              linux-arm64) linux='[{"arch":"arm64"}]' ;;
              macos-arm64) macos='[{"arch":"arm64"}]' ;;
              macos-amd64) macos='[{"arch":"amd64"}]' ;;
              windows-amd64) windows='[{"arch":"amd64"}]' ;;
            esac
          # A new branch reports an all-zero before, which compares against nothing.
          elif [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            linux='[{"arch":"amd64"}]'
          else
            # A comparison that fails reports no file, which would read as a
            # documentation commit and skip the build, so it fails the run first.
            files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" \
              --jq '.files[].filename')
            # Documentation reaches no executable. A path this list does not name
            # builds rather than skips, so a new directory never goes untested.
            changed=$(printf '%s\n' "$files" | grep -vE '^docs/|^LICENSE$|^[^/]+\.md$' || true)
            if [ -n "$changed" ]; then
              printf 'Building for:\n%s\n' "$changed"
              linux='[{"arch":"amd64"}]'
            else
              echo 'Documentation alone changed. Nothing to build.'
            fi
          fi
          # Each Linux architecture publishes a file per C library.
          linux_runtime=$(jq -cn --argjson linux "$linux" \
            '[$linux[] | ({arch: .arch, libc: "musl"}, {arch: .arch, libc: "gnu"})]')
          # Every platform packs the payload job's output, so any target calls for it.
          build=true
          [ "$linux$macos$windows" != '[][][]' ] || build=false
          # The payload job runs PHP from the amd64 musl runtime, so any build compiles it.
          if [ "$build" = true ]; then
            linux_runtime=$(jq -cn --argjson runtimes "$linux_runtime" \
              '$runtimes + [{arch: "amd64", libc: "musl"}] | unique')
          fi
          {
            printf 'version=%s\n' "$version"
            printf 'build=%s\n' "$build"
            printf 'candidate=%s\n' "$candidate"
            printf 'image_tags=%s\n' "$image_tags"
            printf 'linux=%s\n' "$linux"
            printf 'linux_runtime=%s\n' "$linux_runtime"
            printf 'macos=%s\n' "$macos"
            printf 'windows=%s\n' "$windows"
          } >>"$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      # Every builder compiles the extensions runtime/php-extensions.txt names, so
      # a lock that declares one the file omits stops the release here.
      - name: Check the allowlist against the lock
        run: python3 runtime/check-extensions.py demo

  # A builder image carries the PHP its own build compiled, so one image serves
  # one libc on one architecture. Its content follows the inputs
  # runtime/builder-tag.sh digests, and the registry holds it under that digest.
  linux-runtime:
    name: Linux ${{ matrix.arch }} ${{ matrix.libc }} runtime
    needs: gate
    if: needs.gate.outputs.linux_runtime != '[]'
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.gate.outputs.linux_runtime) }}
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - id: builder
        name: Name the builder image
        env:
          LIBC: ${{ matrix.libc }}
        run: |
          tag=$(bash runtime/builder-tag.sh "$LIBC")
          printf 'image=ghcr.io/%s-builder:%s\n' "$GITHUB_REPOSITORY" "$tag" >>"$GITHUB_OUTPUT"

      - name: Log in to the registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # An image under this tag carries the PHP this run needs, whatever run built
      # it. build-static.sh reads the token to raise its GitHub API rate limit
      # while it downloads the PHP and extension sources.
      - id: image
        name: Pull or build the builder image
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.builder.outputs.image }}
          LIBC: ${{ matrix.libc }}
        run: |
          if docker pull -q "$IMAGE"; then
            exit 0
          fi
          bash runtime/build-builder.sh "$LIBC" "$IMAGE" "$RUNNER_TEMP/builder"
          echo 'built=true' >>"$GITHUB_OUTPUT"

      # A fork holds a read-only token. The image it built stays on the runner,
      # where the build below finds it under the same name.
      - name: Publish the builder image
        if: steps.image.outputs.built == 'true' && github.event.repository.fork == false
        env:
          IMAGE: ${{ steps.builder.outputs.image }}
        run: docker push "$IMAGE"

      - name: Build the runtime
        env:
          DRUPACK_VERSION: ${{ needs.gate.outputs.version }}
          IMAGE: ${{ steps.builder.outputs.image }}
          LIBC: ${{ matrix.libc }}
          BUILDER_ARG: ${{ matrix.libc == 'musl' && 'MUSL_BUILDER' || 'GNU_BUILDER' }}
        run: |
          docker build --target "runtime-$LIBC-files" \
            --build-arg "DRUPACK_VERSION=$DRUPACK_VERSION" \
            --build-arg "$BUILDER_ARG=$IMAGE" \
            --output "type=local,dest=runtime-$LIBC" .
          df -h /

      - uses: actions/upload-artifact@v7
        with:
          name: runtime-linux-${{ matrix.arch }}-${{ matrix.libc }}
          path: runtime-${{ matrix.libc }}
          if-no-files-found: error

      # The runtime reports on a runner of its own architecture. The job image
      # carries the report for site builds, and the publish job merges it.
      - name: Report the runtime's components
        env:
          ARCH: ${{ matrix.arch }}
          LIBC: ${{ matrix.libc }}
        run: |
          target=linux-$ARCH
          if [ "$LIBC" = musl ]; then target=$target-musl; fi
          mkdir runtime-components
          python3 build/sbom.py runtime --target "$target" "runtime-$LIBC/out/drupack" >"runtime-components/$target.json"

      - uses: actions/upload-artifact@v7
        with:
          name: runtime-components-linux-${{ matrix.arch }}-${{ matrix.libc }}
          path: runtime-components
          if-no-files-found: error

  # The application is PHP source, vendor, translations and a seeded database.
  # None of it depends on a platform, so every executable packs this one build.
  # drupack-build makes it in the job image, whose PHP is the amd64 musl runtime.
  # Every run pushes that image under the commit, where build.yml finds it, and
  # the publish job names it after the version once every platform passed.
  payload:
    name: payload
    needs: [gate, linux-runtime]
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: ${{ needs.gate.outputs.demo_repository }}
          ref: ${{ needs.gate.outputs.demo_ref }}
          path: demo
          persist-credentials: false

      - uses: actions/download-artifact@v7
        with:
          pattern: runtime-linux-*
          path: runtime-artifacts

      - uses: actions/download-artifact@v7
        with:
          pattern: runtime-components-linux-*
          path: runtime-components
          merge-multiple: true

      # The runtime jobs' exports stand in for the runtimes stage, so no builder
      # image is pulled here. A run of every platform built all four.
      - name: Build the job image
        env:
          DRUPACK_VERSION: ${{ needs.gate.outputs.version }}
          LINUX_RUNTIME: ${{ needs.gate.outputs.linux_runtime }}
        run: |
          mkdir runtimes
          # download-artifact extracts a lone match straight into its path, with no
          # directory named after it, so the gate's one runtime names that directory.
          if [ -d runtime-artifacts/out ]; then
            lone=$(jq -r '.[0] | "runtime-linux-\(.arch)-\(.libc)"' <<<"$LINUX_RUNTIME")
            mkdir "runtime-artifacts/$lone"
            mv runtime-artifacts/out "runtime-artifacts/$lone/out"
          fi
          for artifact in runtime-artifacts/runtime-linux-*; do
            target=${artifact#runtime-artifacts/runtime-}
            # The runtime jobs name the glibc build gnu, after its builder image.
            case "$target" in *-gnu) target=${target%-gnu}-glibc ;; esac
            mv "$artifact/out" "runtimes/$target"
          done
          chmod +x runtimes/*/drupack
          ls runtimes
          docker build --target job --build-arg RUNTIMES=release-runtimes --build-context release-runtimes=runtimes \
            --build-arg RUNTIME_COMPONENTS=release-runtime-components \
            --build-context release-runtime-components=runtime-components \
            --build-arg "DRUPACK_VERSION=$DRUPACK_VERSION" -t drupack-job .

      - name: Export the application payload
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/src" -w /src drupack-job \
            drupack-build --site demo --payload-only --output dist

      # The engine executable carries the engine's files in place of an application.
      - name: Export the engine payload
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/src" -w /src drupack-job \
            drupack-build --engine-executable --payload-only --output dist/engine

      # The macOS and Windows jobs pack the variant fixture from this payload, which
      # holds each of their targets' Node archives.
      - name: Export the variant fixture payload
        run: |
          bash build/variant-fixture.sh demo "$RUNNER_TEMP/variant-site"
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/src" -v "$RUNNER_TEMP/variant-site:/variant-site" -w /src drupack-job \
            drupack-build --site /variant-site --payload-only --output dist/variant

      # A main push and a tag push of one commit run at once. A release's image is
      # sha-COMMIT and a main run pushes dev-COMMIT, so a main run never replaces it.
      - name: Push the job image under this commit
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_TAGS: ${{ needs.gate.outputs.image_tags }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for prefix in $IMAGE_TAGS; do
            docker tag drupack-job "ghcr.io/$GITHUB_REPOSITORY-build:$prefix-$GITHUB_SHA"
            docker push "ghcr.io/$GITHUB_REPOSITORY-build:$prefix-$GITHUB_SHA"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: payload-archive
          path: dist/payload
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: engine-payload-archive
          path: dist/engine/payload
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: variant-payload-archive
          path: dist/variant/payload
          if-no-files-found: error

  # The demo goes through the workflow site repositories call, in the image the
  # payload job pushed. That image carries the amd64 glibc runtime only when the
  # run builds Linux amd64.
  demo:
    name: Drupacked Demo through build.yml
    needs: [gate, payload]
    if: contains(needs.gate.outputs.linux, 'amd64')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build.yml
    with:
      repository: ${{ needs.gate.outputs.demo_repository }}
      ref: ${{ needs.gate.outputs.demo_ref }}
      # The macOS and Windows runtime files of this run are not published yet.
      platforms: linux-amd64

  linux:
    name: Linux ${{ matrix.arch }}
    # GitHub waits on the whole linux-runtime matrix, so this architecture also
    # waits on the other one's two legs. With the builder images published every
    # leg finishes within a minute of the rest.
    needs: [gate, payload, linux-runtime]
    if: needs.gate.outputs.linux != '[]'
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.gate.outputs.linux) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: ${{ needs.gate.outputs.demo_repository }}
          ref: ${{ needs.gate.outputs.demo_ref }}
          path: demo
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Run the Go unit tests
        shell: bash
        run: bash build/go-tests.sh

      - uses: actions/download-artifact@v7
        with:
          name: runtime-linux-${{ matrix.arch }}-musl
          path: runtime-musl

      - uses: actions/download-artifact@v7
        with:
          name: runtime-linux-${{ matrix.arch }}-gnu
          path: runtime-gnu

      - uses: actions/download-artifact@v7
        with:
          name: payload-archive
          path: dist/payload

      - uses: actions/download-artifact@v7
        with:
          name: engine-payload-archive
          path: dist/engine-payload

      # Each file carries one runtime. The launcher itself carries no cgo, so both
      # files start on a glibc and a musl host alike.
      - name: Pack the executables
        working-directory: launcher
        env:
          CGO_ENABLED: '0'
          DRUPACK_VERSION: ${{ needs.gate.outputs.version }}
        run: |
          chmod +x ../runtime-musl/out/drupack ../runtime-gnu/out/drupack
          mkdir -p ../dist/musl ../dist/engine/musl
          for libc in gnu musl; do
            # The musl files land in their own directories, since each artifact holds one file named NAME.
            directory=
            # The glibc file carries the payload's Node archive, and the musl file none.
            node=(-node "../dist/payload/node/linux-${{ matrix.arch }}.tar.gz")
            # A musl file names its libc, so self-update fetches the musl release.
            musl=()
            if [ "$libc" = musl ]; then directory=/musl; node=(); musl=(-musl); fi
            go run ./cmd/pack -runtime "../runtime-$libc/out" \
              -entry drupack -version "$DRUPACK_VERSION" -source . -output "../dist$directory/drupacked-demo" \
              -app ../dist/payload/app-payload.tar -app-checksum ../dist/payload/app_checksum.txt \
              -site ../dist/payload/site.json -site-version "$DRUPACK_VERSION" ${node[@]+"${node[@]}"} ${musl[@]+"${musl[@]}"}
            go run ./cmd/pack -engine -runtime "../runtime-$libc/out" \
              -entry drupack -version "$DRUPACK_VERSION" -source . -output "../dist/engine$directory/drupack" \
              -app ../dist/engine-payload/app-payload.tar -app-checksum ../dist/engine-payload/app_checksum.txt \
              ${musl[@]+"${musl[@]}"}
          done
          cp ../dist/payload/site.json ../dist/site.json

      - name: Run the Python unit tests
        run: bash build/unit-tests.sh

      - name: Run the test scripts
        env:
          DRUPACK_TEST_ENGINE: dist/engine/drupack
        run: |
          python3 tests/conformance dist/drupacked-demo test-results/conformance --site-tests demo/tests

      - name: Check each file's runtime and size
        run: |
          set -eu
          for file in dist/drupacked-demo dist/engine/drupack; do
            "$file" --version | grep ', glibc)$'
          done
          for file in dist/musl/drupacked-demo dist/engine/musl/drupack; do
            "$file" --version | grep ', musl)$'
          done
          for file in dist/drupacked-demo dist/musl/drupacked-demo dist/engine/drupack dist/engine/musl/drupack; do
            printf '%s: %d MB\n' "$file" "$(( $(stat -c %s "$file") / 1000000 ))"
          done

      - name: Start a SQLite site on a musl host
        run: |
          docker run -d --name alpine-site --network none \
            --mount type=bind,src="$PWD/dist/musl/drupacked-demo",dst=/usr/local/bin/drupacked-demo,readonly \
            alpine@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d \
            drupacked-demo --foreground --data-dir /tmp/site --admin-user alpine-admin --admin-password Alpine.check.password.2026
          for _ in $(seq 1 60); do
            if docker exec alpine-site wget -q -O /dev/null http://127.0.0.1:7225/user/login 2>/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs alpine-site
          exit 1

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-linux-${{ matrix.arch }}
          path: test-results

      - uses: actions/upload-artifact@v7
        with:
          name: drupack-linux-${{ matrix.arch }}
          path: dist/engine/drupack
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: drupack-linux-${{ matrix.arch }}-musl
          path: dist/engine/musl/drupack
          if-no-files-found: error

  windows:
    name: Windows amd64
    needs: [gate, payload]
    if: needs.gate.outputs.windows != '[]'
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: ${{ needs.gate.outputs.demo_repository }}
          ref: ${{ needs.gate.outputs.demo_ref }}
          path: demo
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Run the Go unit tests
        shell: bash
        run: bash build/go-tests.sh

      - uses: actions/download-artifact@v8
        with:
          name: payload-archive
          path: dist/payload

      - uses: actions/download-artifact@v8
        with:
          name: engine-payload-archive
          path: dist/engine-payload

      - uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}\drupack\downloads
            ${{ runner.temp }}\drupack\vcpkg
            ~\AppData\Local\vcpkg\archives
            ~\go\pkg\mod
            ~\AppData\Local\go-build
          key: windows-build-${{ hashFiles('build/windows/build.ps1') }}

      - name: Build the executables
        env:
          DRUPACK_VERSION: ${{ needs.gate.outputs.version }}
        run: |
          ./build/windows/build.ps1 -PayloadDirectory dist\payload -Version $env:DRUPACK_VERSION -WorkDirectory "$env:RUNNER_TEMP\drupack" -Output dist\drupacked-demo.exe -EnginePayloadDirectory dist\engine-payload -EngineOutput dist\engine\drupack.exe

      # The engine uploads before the suite, so a run the suite hangs still keeps it.
      - uses: actions/upload-artifact@v7
        with:
          name: drupack-windows-amd64
          path: dist/engine/drupack.exe
          if-no-files-found: error

      # The runtime both executables carry, which the publish job archives as a Release file.
      - uses: actions/upload-artifact@v7
        with:
          name: runtime-windows-amd64
          path: ${{ runner.temp }}\drupack\runtime
          if-no-files-found: error

      - name: Report the runtime's components
        run: |
          New-Item -ItemType Directory -Path runtime-components | Out-Null
          python build/sbom.py runtime --target windows-amd64 "$env:RUNNER_TEMP\drupack\runtime\frankenphp.exe" >runtime-components\windows-amd64.json

      - uses: actions/upload-artifact@v7
        with:
          name: runtime-components-windows-amd64
          path: runtime-components
          if-no-files-found: error

      - name: Run the conformance suite
        env:
          DRUPACK_TEST_ENGINE: dist\engine\drupack.exe
        run: |
          Copy-Item dist\payload\site.json dist\site.json
          python tests/conformance dist\drupacked-demo.exe test-results\conformance --site-tests demo\tests

      - uses: actions/download-artifact@v8
        with:
          name: variant-payload-archive
          path: dist/variant-payload

      # The variant fixture packs on the runtime the build above left in its work directory.
      - name: Run the variant fixture cases
        env:
          DRUPACK_VERSION: ${{ needs.gate.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path dist\variant | Out-Null
          Push-Location launcher
          go run ./cmd/pack -runtime "$env:RUNNER_TEMP\drupack\runtime" -entry frankenphp.exe -version $env:DRUPACK_VERSION -source . -output ..\dist\variant\variant-demo.exe -app ..\dist\variant-payload\app-payload.tar -app-checksum ..\dist\variant-payload\app_checksum.txt -site ..\dist\variant-payload\site.json -site-version $env:DRUPACK_VERSION -node ..\dist\variant-payload\node\windows-amd64.zip
          Pop-Location
          Copy-Item dist\variant-payload\site.json dist\variant\site.json
          python tests/conformance dist\variant\variant-demo.exe test-results\variant -k Node -k MercureHub

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-windows-amd64
          path: test-results

  # install.ps1 installs the amd64 build on Windows on Arm, which runs it under
  # the system's x64 emulation. This job builds the amd64 executables on an Arm
  # host and runs the suite on them there.
  windows-arm:
    name: Windows arm64 (amd64 emulated)
    needs: [gate, payload]
    if: needs.gate.outputs.windows != '[]'
    runs-on: windows-11-arm
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: ${{ needs.gate.outputs.demo_repository }}
          ref: ${{ needs.gate.outputs.demo_ref }}
          path: demo
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - uses: actions/download-artifact@v8
        with:
          name: payload-archive
          path: dist/payload

      - uses: actions/download-artifact@v8
        with:
          name: engine-payload-archive
          path: dist/engine-payload

      - uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}\drupack\downloads
            ${{ runner.temp }}\drupack\vcpkg
            ~\AppData\Local\vcpkg\archives
            ~\go\pkg\mod
            ~\AppData\Local\go-build
          key: windows-arm-build-${{ hashFiles('build/windows/build.ps1') }}

      - name: Build the executables
        env:
          DRUPACK_VERSION: ${{ needs.gate.outputs.version }}
        run: |
          ./build/windows/build.ps1 -PayloadDirectory dist\payload -Version $env:DRUPACK_VERSION -WorkDirectory "$env:RUNNER_TEMP\drupack" -Output dist\drupacked-demo.exe -EnginePayloadDirectory dist\engine-payload -EngineOutput dist\engine\drupack.exe

      - name: Run the conformance suite
        env:
          DRUPACK_TEST_ENGINE: dist\engine\drupack.exe
        run: |
          Copy-Item dist\payload\site.json dist\site.json
          python tests/conformance dist\drupacked-demo.exe test-results\conformance --site-tests demo\tests

      - uses: actions/download-artifact@v8
        with:
          name: variant-payload-archive
          path: dist/variant-payload

      # The variant fixture packs on the runtime the build above left in its work
      # directory, with the amd64 launcher the release ships.
      - name: Run the variant fixture cases
        env:
          DRUPACK_VERSION: ${{ needs.gate.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path dist\variant | Out-Null
          Push-Location launcher
          go run ./cmd/pack -goarch amd64 -runtime "$env:RUNNER_TEMP\drupack\runtime" -entry frankenphp.exe -version $env:DRUPACK_VERSION -source . -output ..\dist\variant\variant-demo.exe -app ..\dist\variant-payload\app-payload.tar -app-checksum ..\dist\variant-payload\app_checksum.txt -site ..\dist\variant-payload\site.json -site-version $env:DRUPACK_VERSION -node ..\dist\variant-payload\node\windows-amd64.zip
          Pop-Location
          Copy-Item dist\variant-payload\site.json dist\variant\site.json
          python tests/conformance dist\variant\variant-demo.exe test-results\variant -k Node -k MercureHub

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-windows-arm64
          path: test-results

  macos:
    name: macOS ${{ matrix.arch }}
    needs: [gate, payload]
    if: needs.gate.outputs.macos != '[]'
    runs-on: ${{ matrix.arch == 'arm64' && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.gate.outputs.macos) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: ${{ needs.gate.outputs.demo_repository }}
          ref: ${{ needs.gate.outputs.demo_ref }}
          path: demo
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Run the Go unit tests
        shell: bash
        run: bash build/go-tests.sh

      - uses: actions/download-artifact@v8
        with:
          name: payload-archive
          path: dist/payload

      - uses: actions/download-artifact@v8
        with:
          name: engine-payload-archive
          path: dist/engine-payload

      # The buildroot holds the PHP the allowlist names, so the list files belong
      # in the key beside the script that compiles them.
      - uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.temp }}/drupack/downloads
            ${{ runner.temp }}/drupack/buildroot
            ${{ runner.temp }}/drupack/pkgroot
          key: macos-${{ matrix.arch }}-${{ hashFiles('build/macos/build.sh', 'runtime/builder-inputs.sh', 'runtime/php-extensions.txt', 'runtime/php-extension-libs.txt') }}

      - name: Build the executables
        env:
          # static-php-cli reads library releases from the GitHub API, which rate-limits anonymous requests.
          GITHUB_TOKEN: ${{ github.token }}
          DRUPACK_VERSION: ${{ needs.gate.outputs.version }}
        run: |
          bash build/macos/build.sh dist/payload "$RUNNER_TEMP/drupack" dist/drupacked-demo dist/engine-payload dist/engine/drupack
          cp dist/payload/site.json dist/site.json

      # Saved before the tests, so a failed test does not repeat the PHP build.
      - uses: actions/cache/save@v6
        with:
          path: |
            ${{ runner.temp }}/drupack/downloads
            ${{ runner.temp }}/drupack/buildroot
            ${{ runner.temp }}/drupack/pkgroot
          key: macos-${{ matrix.arch }}-${{ hashFiles('build/macos/build.sh', 'runtime/builder-inputs.sh', 'runtime/php-extensions.txt', 'runtime/php-extension-libs.txt') }}

      # The runtime both executables carry, which the publish job archives as a Release file.
      - uses: actions/upload-artifact@v7
        with:
          name: runtime-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/drupack/runtime
          if-no-files-found: error

      - name: Report the runtime's components
        env:
          TARGET: macos-${{ matrix.arch }}
        run: |
          mkdir runtime-components
          python3 build/sbom.py runtime --target "$TARGET" "$RUNNER_TEMP/drupack/runtime/drupack" >"runtime-components/$TARGET.json"

      - uses: actions/upload-artifact@v7
        with:
          name: runtime-components-macos-${{ matrix.arch }}
          path: runtime-components
          if-no-files-found: error

      - name: Run the test scripts
        env:
          DRUPACK_TEST_ENGINE: dist/engine/drupack
        run: |
          python3 tests/conformance dist/drupacked-demo test-results/conformance --site-tests demo/tests

      - uses: actions/download-artifact@v8
        with:
          name: variant-payload-archive
          path: dist/variant-payload

      # The variant fixture packs on the runtime the build above left in its work directory.
      - name: Run the variant fixture cases
        env:
          DRUPACK_VERSION: ${{ needs.gate.outputs.version }}
        run: |
          mkdir -p dist/variant
          (cd launcher && go run ./cmd/pack -runtime "$RUNNER_TEMP/drupack/runtime" -entry drupack \
            -version "$DRUPACK_VERSION" -source . -output ../dist/variant/variant-demo \
            -app ../dist/variant-payload/app-payload.tar -app-checksum ../dist/variant-payload/app_checksum.txt \
            -site ../dist/variant-payload/site.json -site-version "$DRUPACK_VERSION" \
            -node "../dist/variant-payload/node/macos-${{ matrix.arch }}.tar.gz")
          cp dist/variant-payload/site.json dist/variant/site.json
          python3 tests/conformance dist/variant/variant-demo test-results/variant -k Node -k MercureHub

      - name: Check the unsigned launch steps
        run: |
          cp dist/drupacked-demo test-results/quarantined
          xattr -w com.apple.quarantine "0081;$(printf '%x' "$(date +%s)");Safari;" test-results/quarantined
          xattr -d com.apple.quarantine test-results/quarantined
          test-results/quarantined --help

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-macos-${{ matrix.arch }}
          path: test-results

      - uses: actions/upload-artifact@v7
        with:
          name: drupack-macos-${{ matrix.arch }}
          path: dist/engine/drupack
          if-no-files-found: error

  # An all-platform dispatch also runs build/qa.sh. upstream.yml dispatches one
  # for each release candidate.
  qa:
    name: QA
    needs: linux-runtime
    if: github.event_name == 'workflow_dispatch' && inputs.platform == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      # The Dockerfile builds on drupack-builder-{gnu,musl}:local, which the
      # runtime jobs of this run published under their digest tags.
      - name: Pull the builder images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for libc in gnu musl; do
            image=ghcr.io/$GITHUB_REPOSITORY-builder:$(bash runtime/builder-tag.sh "$libc")
            docker pull -q "$image"
            docker tag "$image" "drupack-builder-$libc:local"
          done

      - name: Run build/qa.sh
        run: |
          set -o pipefail
          bash build/qa.sh 2>&1 | tee "$RUNNER_TEMP/qa.log"

      - name: Summarize the QA
        if: always()
        run: |
          {
            printf '### build/qa.sh\n\n```\n'
            grep -E '^(Ran |OK|FAILED|ok |FAIL)' "$RUNNER_TEMP/qa.log" || true
            printf '```\n'
          } >>"$GITHUB_STEP_SUMMARY"

  # A tag run that publishes its candidate's files skips every build job.
  publish:
    needs: [gate, linux, windows, windows-arm, macos, demo]
    if: ${{ !cancelled() && !failure() && github.ref_type == 'tag' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      # download-artifact reads another run only when it has a token, and its own
      # run when the token is empty.
      - uses: actions/download-artifact@v8
        with:
          pattern: drupack-*
          path: candidates
          run-id: ${{ needs.gate.outputs.candidate || github.run_id }}
          github-token: ${{ needs.gate.outputs.candidate && github.token || '' }}

      # A tag's files come from a run of every platform, so each macOS runtime lands
      # in a directory named after its artifact. A lone match would land in the path
      # itself, hence the Windows runtime's own step.
      - uses: actions/download-artifact@v8
        with:
          pattern: runtime-macos-*
          path: runtimes
          run-id: ${{ needs.gate.outputs.candidate || github.run_id }}
          github-token: ${{ needs.gate.outputs.candidate && github.token || '' }}

      - uses: actions/download-artifact@v8
        with:
          name: runtime-windows-amd64
          path: runtimes/runtime-windows-amd64
          run-id: ${{ needs.gate.outputs.candidate || github.run_id }}
          github-token: ${{ needs.gate.outputs.candidate && github.token || '' }}

      - uses: actions/download-artifact@v8
        with:
          pattern: runtime-components-*
          path: runtime-components
          merge-multiple: true
          run-id: ${{ needs.gate.outputs.candidate || github.run_id }}
          github-token: ${{ needs.gate.outputs.candidate && github.token || '' }}

      # Each artifact is NAME-TARGET holding one file, NAME or NAME.exe. The loop
      # names each file NAME-TARGET, keeping .exe, as release-files.py reads it.
      - name: Write the release files
        run: |
          mkdir built
          for candidate in candidates/*/*; do
            directory=${candidate%/*}
            file=${candidate##*/}
            cp "$candidate" "built/${directory##*/}${file#"${file%.exe}"}"
          done
          runtimes=()
          for runtime in runtimes/*; do
            runtimes+=(--runtime "$runtime")
          done
          python3 build/release-files.py --output release --version "$VERSION" \
            --base-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$VERSION" \
            --commit "$GITHUB_SHA" "${runtimes[@]}" built/*

      # syft reads the launcher's Go modules from the executables, and FrankenPHP's
      # from the macOS and Windows runtimes. The action's own artifact,
      # drupack-publish.cyclonedx.json, would match the drupack-* download above
      # on a rerun of this job.
      - name: Scan the executables
        uses: anchore/sbom-action@v0
        with:
          path: built
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/executables.cdx.json
          upload-artifact: false

      - name: Scan the runtimes
        uses: anchore/sbom-action@v0
        with:
          path: runtimes
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/runtimes.cdx.json
          upload-artifact: false

      # Each runtime's report names what the executables carry compressed. A site
      # build reads the macOS and Windows reports from runtime-components.json.
      - name: Write the SBOM
        run: |
          python3 build/sbom.py merge --name drupack --version "$VERSION" \
            --runtime-components runtime-components/*.json --output release/drupack.cdx.json \
            "$RUNNER_TEMP/executables.cdx.json" "$RUNNER_TEMP/runtimes.cdx.json"
          jq -s add runtime-components/*.json >release/runtime-components.json

      - name: Attest the release files
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/*

      # Site builds pull the job image by the engine's version.
      - name: Name the job image after the version
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create --tag "ghcr.io/$GITHUB_REPOSITORY-build:$VERSION" \
            "ghcr.io/$GITHUB_REPOSITORY-build:sha-$GITHUB_SHA"

      # GitHub refuses github.token a release whose commit differs from main in
      # .github/workflows, which happens once main moves during a tag run.
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
        run: |
          gh release create "$VERSION" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Drupack $VERSION" \
            --generate-notes
