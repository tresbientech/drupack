name: 'Wordpal Display Builder Runtime'
type: module
description: 'Renders converted Display Builder Views and pages: the pattern preset area plugin, the page-layout content wrapper and the page layout theme guard.'
package: 'WordPal'
core_version_requirement: ^11.4
dependencies:
  - wordpal:wordpal
  - drupal:views
  - display_builder:display_builder
  - display_builder:display_builder_entity_view
  - display_builder:display_builder_page_layout
  - display_builder:display_builder_views
  - ui_patterns:ui_patterns
  - ui_patterns:ui_patterns_field
  - ui_patterns:ui_patterns_field_formatters
  - ui_patterns:ui_patterns_views
  - ui_skins:ui_skins
