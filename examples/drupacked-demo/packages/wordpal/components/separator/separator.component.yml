name: Separator
description: 'Create a break between ideas or sections with a horizontal separator.'
status: stable
group: 'WordPress: design'
links:
  - 'https://github.com/WordPress/wordpress-develop/tree/trunk/src/wp-includes/blocks/separator'
props:
  type: object
  properties:
    opacity:
      title: Opacity
      type: string
      examples:
        - alpha-channel
      x-wordpal-panel: settings
    tag_name:
      title: 'Tag name'
      type: string
      enum:
        - hr
        - div
      'meta:enum':
        hr: Hr
        div: Div
      examples:
        - hr
      x-wordpal-panel: settings
    align:
      title: Align
      type: string
      enum:
        - center
        - wide
        - full
      'meta:enum':
        center: 'Align center'
        wide: 'Wide width'
        full: 'Full width'
      x-wordpal-panel: settings
    anchor:
      title: Anchor
      type: string
      x-wordpal-panel: advanced
    css_class:
      title: 'CSS class'
      type: string
      x-wordpal-panel: advanced
    background_color:
      title: 'Background color'
      type: string
      x-wordpal-panel: color
    gradient:
      title: Gradient
      type: string
      x-wordpal-panel: color
    margin_top:
      title: 'Margin top'
      type: string
      x-wordpal-panel: dimensions
    margin_bottom:
      title: 'Margin bottom'
      type: string
      x-wordpal-panel: dimensions
    self_stretch:
      title: 'Self stretch'
      type: string
      enum:
        - fit
        - fill
        - fixed
        - fixedNoShrink
      'meta:enum':
        fit: Fit
        fill: Grow
        fixed: Max
        fixedNoShrink: Fixed
      x-wordpal-panel: dimensions
    flex_size:
      title: 'Flex size'
      type: string
      x-wordpal-panel: dimensions
