# drupal.org's runners run the unit tests of a merge request, and one daily job
# that starts GitHub's workflows. GitHub's release.yml builds and tests the
# executables.

tests:
  image: golang:bookworm
  interruptible: true
  # build/go-tests.sh compiles golangci-lint on each run. The kept caches let a
  # later run reuse that build; a cache sits inside the checkout or not at all.
  variables:
    GOCACHE: $CI_PROJECT_DIR/.go/build
    GOMODCACHE: $CI_PROJECT_DIR/.go/mod
  cache:
    key:
      files:
        - build/go-tests.sh
        - launcher/go.sum
    paths:
      - .go/
  rules:
    # GitLab's changes takes no negation, so the list names every tracked path
    # outside docs/, LICENSE and the root Markdown files.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - .github/**/*
        - .gitlab-ci.yml
        - Dockerfile
        - application/**/*
        - build/**/*
        - ci/**/*
        - composer.json
        - composer/**/*
        - launcher/**/*
        - runtime/**/*
        - tests/**/*
  script:
    # build/release-files.py packs with zstd.
    - apt-get update --quiet --quiet && apt-get install --yes --quiet --quiet --no-install-recommends python3 zstd
    # go downloads the toolchain release.yml pins.
    - |
      export GOTOOLCHAIN="go$(sed -n "s/^  GO_VERSION: '\(.*\)'$/\1/p" .github/workflows/release.yml)"
    - bash build/go-tests.sh
    - bash build/unit-tests.sh

# GitHub's cron starts late under load, so drupal.org's pipeline schedule is the
# clock. GITHUB_DISPATCH_TOKEN is a masked, protected CI/CD variable.
dispatch:
  image:
    name: curlimages/curl
    entrypoint: [""]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - |
      for workflow in release-node.yml upstream.yml; do
        curl --fail --silent --show-error --retry 3 -X POST \
          -H "Authorization: Bearer $GITHUB_DISPATCH_TOKEN" -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/tresbientech/drupack/actions/workflows/$workflow/dispatches" -d '{"ref":"main"}'
      done
