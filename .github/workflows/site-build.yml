name: Site build

# Builds the pinned Drupacked Demo commit through build.yml, the workflow site
# repositories call, in the job image pushed under main's commit: by a release.yml
# run on main, or by the candidate run of a release. A release's own run does not
# wait for it.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pin:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      repository: ${{ steps.demo.outputs.repository }}
      ref: ${{ steps.demo.outputs.ref }}
      built: ${{ steps.built.outputs.built }}
    steps:
      - uses: actions/checkout@v7

      - id: demo
        name: Name the demo commit
        run: |
          . build/release/demo-pin.sh
          printf 'repository=%s\nref=%s\n' "$demo_repository" "$demo_ref" >>"$GITHUB_OUTPUT"

      # A commit that changed documentation alone has no job image.
      - id: built
        name: Find the job image
        run: |
          image=$GITHUB_REPOSITORY-build
          token=$(curl -fsS "https://ghcr.io/token?scope=repository:$image:pull" | jq -r .token)
          code=$(curl -sS -o /dev/null -w '%{http_code}' -I -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/$image/manifests/dev-$GITHUB_SHA")
          echo "ghcr.io/$image:dev-$GITHUB_SHA answers HTTP $code."
          # Any answer but found or missing stops the job, so a registry outage never reads as no image.
          case $code in
            200) echo built=true ;;
            404) echo built=false ;;
            *) exit 1 ;;
          esac >>"$GITHUB_OUTPUT"

  build:
    name: Drupacked Demo through build.yml
    needs: pin
    if: needs.pin.outputs.built == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build.yml
    with:
      repository: ${{ needs.pin.outputs.repository }}
      ref: ${{ needs.pin.outputs.ref }}
      # The macOS and Windows runtime files of this commit are not published.
      platforms: linux-amd64
      # release.yml's Linux jobs test this build in full; this run proves the entry point a site calls.
      suite: smoke
