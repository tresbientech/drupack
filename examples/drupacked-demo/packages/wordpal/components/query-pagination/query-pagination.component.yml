name: Pagination
description: 'Displays a paginated navigation to next/previous set of posts, when applicable.'
status: stable
group: 'WordPress: theme'
links:
  - 'https://github.com/WordPress/wordpress-develop/tree/trunk/src/wp-includes/blocks/query-pagination'
slots:
  content:
    title: Content
props:
  type: object
  properties:
    pagination_arrow:
      title: 'Pagination arrow'
      type: string
      examples:
        - none
      x-wordpal-panel: settings
    show_label:
      title: 'Show label'
      type: boolean
      examples:
        - true
      x-wordpal-panel: settings
    align:
      title: Align
      type: string
      enum:
        - left
        - center
        - right
        - wide
        - full
      'meta:enum':
        left: 'Align left'
        center: 'Align center'
        right: 'Align right'
        wide: 'Wide width'
        full: 'Full width'
      x-wordpal-panel: settings
    anchor:
      title: Anchor
      type: string
      x-wordpal-panel: advanced
    css_class:
      title: 'CSS class'
      type: string
      x-wordpal-panel: advanced
    font_size:
      title: 'Font size'
      type: string
      x-wordpal-panel: typography
    line_height:
      title: 'Line height'
      type: string
      x-wordpal-panel: typography
    font_family:
      title: 'Font family'
      type: string
      x-wordpal-panel: typography
    font_weight:
      title: 'Font weight'
      type: string
      x-wordpal-panel: typography
    font_style:
      title: 'Font style'
      type: string
      x-wordpal-panel: typography
    text_transform:
      title: 'Text transform'
      type: string
      x-wordpal-panel: typography
    text_decoration:
      title: 'Text decoration'
      type: string
      x-wordpal-panel: typography
    letter_spacing:
      title: 'Letter spacing'
      type: string
      x-wordpal-panel: typography
    background_color:
      title: 'Background color'
      type: string
      x-wordpal-panel: color
    text_color:
      title: 'Text color'
      type: string
      x-wordpal-panel: color
    gradient:
      title: Gradient
      type: string
      x-wordpal-panel: color
    link_color:
      title: 'Link color'
      type: string
      x-wordpal-panel: color
    heading_color:
      title: 'Heading color'
      type: string
      x-wordpal-panel: color
    button_color:
      title: 'Button color'
      type: string
      x-wordpal-panel: color
    button_background_color:
      title: 'Button background color'
      type: string
      x-wordpal-panel: color
    layout_type:
      title: 'Layout type'
      type: string
      enum:
        - default
        - constrained
        - flex
        - grid
      'meta:enum':
        default: Flow
        constrained: Constrained
        flex: Flex
        grid: Grid
      x-wordpal-panel: layout
    justify_content:
      title: 'Justify content'
      type: string
      enum:
        - left
        - center
        - right
        - space-between
