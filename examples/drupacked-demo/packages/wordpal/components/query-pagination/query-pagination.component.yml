      'meta:enum':
        left: 'Justify items left'
        center: 'Justify items center'
        right: 'Justify items right'
        space-between: 'Space between items'
        stretch: Stretch
      x-wordpal-panel: layout
    orientation:
      title: Orientation
      type: string
      enum:
