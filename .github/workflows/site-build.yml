name: Site build

# Builds the Drupacked Demo's latest release through build.yml, the workflow site
# repositories call, in the job image pushed under this run's commit. A candidate
# dispatches it at its own branch, and a release.yml run on main starts it. It
# reports alone: no release waits for it.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      repository: ${{ steps.release.outputs.repository }}
      ref: ${{ steps.release.outputs.ref }}
      built: ${{ steps.built.outputs.built }}
    steps:
      - id: release
        name: Name the demo's latest release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: tresbientech/drupacked-demo
        run: |
          tag=$(gh api "repos/$REPOSITORY/releases/latest" --jq .tag_name)
          # The tag is remote input, written into the build's checkout ref.
          [[ $tag =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]+$ ]] || { echo "The demo's latest release is named '$tag'." >&2; exit 1; }
          echo "Drupacked Demo $tag"
          printf 'repository=%s\nref=refs/tags/%s\n' "$REPOSITORY" "$tag" >>"$GITHUB_OUTPUT"

      # A commit that changed documentation alone has no job image.
      - id: built
        name: Find the job image
        run: |
          image=$GITHUB_REPOSITORY-build
          token=$(curl -fsS "https://ghcr.io/token?scope=repository:$image:pull" | jq -r .token)
          code=$(curl -sS -o /dev/null -w '%{http_code}' -I -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/$image/manifests/dev-$GITHUB_SHA")
          echo "ghcr.io/$image:dev-$GITHUB_SHA answers HTTP $code."
          # Any answer but found or missing stops the job, so a registry outage never reads as no image.
          case $code in
            200) echo built=true ;;
            404) echo built=false ;;
            *) exit 1 ;;
          esac >>"$GITHUB_OUTPUT"

  build:
    name: Drupacked Demo through build.yml
    needs: demo
    if: needs.demo.outputs.built == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build.yml
    with:
      repository: ${{ needs.demo.outputs.repository }}
      ref: ${{ needs.demo.outputs.ref }}
      # The macOS and Windows runtime files of this commit are not published.
      platforms: linux-amd64
      suite: full
