name: Image
description: 'Insert an image to make a visual statement.'
status: stable
group: 'WordPress: media'
links:
  - 'https://github.com/WordPress/wordpress-develop/tree/trunk/src/wp-includes/blocks/image'
props:
  type: object
  properties:
    url:
      title: URL
      type: string
      format: uri-reference
      x-wordpal-panel: content
    alt:
      title: Alt
      type: string
      x-wordpal-panel: content
    caption:
      title: Caption
      type: string
      contentMediaType: text/html
      x-formatting-context: inline
      x-wordpal-panel: content
    title:
      title: Title
      type: string
      x-wordpal-panel: content
    href:
      title: Href
      type: string
      x-wordpal-panel: content
      format: uri-reference
    id:
      title: Id
      type: number
      x-wordpal-panel: content
    blob:
      title: Blob
      type: string
      x-wordpal-panel: settings
    rel:
      title: Rel
      type: string
      x-wordpal-panel: settings
    link_class:
      title: 'Link class'
      type: string
      x-wordpal-panel: settings
    width:
      title: Width
      type: string
      x-wordpal-panel: settings
    height:
      title: Height
      type: string
      x-wordpal-panel: settings
    aspect_ratio:
      title: 'Aspect ratio'
      type: string
      x-wordpal-panel: settings
    scale:
      title: Scale
      type: string
      x-wordpal-panel: settings
    size_slug:
      title: 'Size slug'
      type: string
      x-wordpal-panel: settings
    link_destination:
      title: 'Link destination'
      type: string
      x-wordpal-panel: settings
    link_target:
      title: 'Link target'
      type: string
      x-wordpal-panel: settings
    is_decorative:
      title: 'Is decorative'
      type: boolean
      examples:
        - false
      x-wordpal-panel: settings
    align:
      title: Align
      type: string
      enum:
        - none
        - left
        - center
        - right
        - wide
        - full
      'meta:enum':
        none: None
        left: 'Align left'
        center: 'Align center'
        right: 'Align right'
        wide: 'Wide width'
        full: 'Full width'
      x-wordpal-panel: settings
    in_template_part:
      title: 'In a Template part'
      type: boolean
      x-wordpal-panel: settings
    in_gallery:
      title: 'In a Gallery'
      type: boolean
      x-wordpal-panel: settings
    anchor:
      title: Anchor
      type: string
      x-wordpal-panel: advanced
    css_class:
      title: 'CSS class'
      type: string
      x-wordpal-panel: advanced
    link_color:
      title: 'Link color'
      type: string
      x-wordpal-panel: color
    heading_color:
      title: 'Heading color'
      type: string
      x-wordpal-panel: color
    button_color:
      title: 'Button color'
      type: string
      x-wordpal-panel: color
    button_background_color:
      title: 'Button background color'
      type: string
      x-wordpal-panel: color
    duotone:
      title: Duotone
      type: string
      x-wordpal-panel: filter
      x-wordpal-duotone-selector: '.wp-block-image img, .wp-block-image .components-placeholder'
    margin_top:
      title: 'Margin top'
      type: string
      x-wordpal-panel: dimensions
    margin_right:
      title: 'Margin right'
      type: string
      x-wordpal-panel: dimensions
    margin_bottom:
      title: 'Margin bottom'
      type: string
      x-wordpal-panel: dimensions
    margin_left:
      title: 'Margin left'
      type: string
      x-wordpal-panel: dimensions
    self_stretch:
      title: 'Self stretch'
      type: string
      enum:
        - fit
        - fill
        - fixed
        - fixedNoShrink
      'meta:enum':
        fit: Fit
        fill: Grow
        fixed: Max
        fixedNoShrink: Fixed
      x-wordpal-panel: dimensions
    flex_size:
      title: 'Flex size'
      type: string
      x-wordpal-panel: dimensions
    border_radius:
      title: 'Border radius'
      type: string
      x-wordpal-panel: border
    border_color:
      title: 'Border color'
      type: string
      x-wordpal-panel: border
    border_width:
      title: 'Border width'
      type: string
      x-wordpal-panel: border
    border_top_width:
      title: 'Border top width'
      type: string
      x-wordpal-panel: border
    border_top_color:
      title: 'Border top color'
      type: string
      x-wordpal-panel: border
    border_right_width:
      title: 'Border right width'
      type: string
      x-wordpal-panel: border
    border_right_color:
      title: 'Border right color'
      type: string
      x-wordpal-panel: border
    border_bottom_width:
      title: 'Border bottom width'
      type: string
      x-wordpal-panel: border
    border_bottom_color:
      title: 'Border bottom color'
      type: string
      x-wordpal-panel: border
    border_left_width:
      title: 'Border left width'
      type: string
      x-wordpal-panel: border
    border_left_color:
      title: 'Border left color'
      type: string
      x-wordpal-panel: border
    border_top_left_radius:
      title: 'Border top left radius'
      type: string
      x-wordpal-panel: border
    border_top_right_radius:
      title: 'Border top right radius'
      type: string
      x-wordpal-panel: border
    border_bottom_left_radius:
      title: 'Border bottom left radius'
      type: string
      x-wordpal-panel: border
