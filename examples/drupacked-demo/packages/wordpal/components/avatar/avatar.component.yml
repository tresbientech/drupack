    border_bottom_color:
      title: 'Border bottom color'
      type: string
      x-wordpal-panel: border
    border_bottom_style:
      title: 'Border bottom style'
      type: string
      enum:
        - none
        - solid
        - dashed
        - dotted
        - double
        - groove
        - ridge
