name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Build the executable
        run: docker build --target artifact --output type=local,dest=dist .

      - name: Run the test scripts
        run: |
          bash tests/database-init.sh dist/drupack test-results/database
          bash tests/offline.sh dist/drupack test-results/offline
          bash tests/network.sh dist/drupack test-results/network

      - name: Start a SQLite site on a musl host
        run: |
          docker run -d --name alpine-site --network none \
            --mount type=bind,src="$PWD/dist/drupack",dst=/usr/local/bin/drupack,readonly \
            alpine@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d \
            drupack --data-dir /tmp/site --admin-user alpine-admin --admin-password Alpine.check.password.2026
          for attempt in $(seq 1 60); do
            if docker exec alpine-site wget -q -O /dev/null http://127.0.0.1:8080/user/login 2>/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs alpine-site
          exit 1

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux-${{ matrix.architecture }}
          path: test-results

      - uses: actions/upload-artifact@v4
        with:
          name: drupack-linux-${{ matrix.architecture }}
          path: dist/drupack
          if-no-files-found: error

  publish:
    needs: linux
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: drupack-linux-*
          path: candidates

      - name: Name assets and write checksums.txt and release.json
        run: |
          mkdir release
          for candidate in candidates/drupack-*/drupack; do
            target=${candidate#candidates/drupack-}
            target=${target%/drupack}
            asset="drupack-${VERSION}-${target}"
            cp "$candidate" "release/$asset"
            chmod 0755 "release/$asset"
            sha256=$(sha256sum "release/$asset" | cut -d ' ' -f 1)
            printf '%s  %s\n' "$sha256" "$asset" >>release/checksums.txt
            jq -n \
              --arg asset "$asset" \
              --arg target "$target" \
              --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}/${asset}" \
              --arg sha256 "$sha256" \
              --argjson size "$(stat --format=%s "release/$asset")" \
              '{asset: $asset, target: $target, url: $url, sha256: $sha256, size: $size}'
          done | jq -s --arg version "$VERSION" --arg commit "$GITHUB_SHA" \
            '{version: $version, build_commit: $commit, assets: .}' >release/release.json

      - name: Generate the SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: release/drupack.cdx.json

      - name: Publish the GitHub Release
        run: |
          gh release create "$VERSION" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Drupack $VERSION" \
            --generate-notes
