name: Release

on:
  push:
    branches:
      - main
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      platform:
        description: Target to build and test; a tag push always builds every platform.
        type: choice
        default: all
        options:
          - all
          - linux-amd64
          - linux-arm64
          - macos-arm64
          - macos-amd64
          - windows-amd64

permissions:
  contents: read

jobs:
  # What a push reaches. A tag and a dispatch build every platform. A main push
  # builds Linux amd64, and only when it touched something an executable carries.
  # GitHub leaves the effect of a path filter on a tag push undocumented, so the
  # comparison happens here rather than under `on:`.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.inputs.outputs.build }}
      full: ${{ steps.inputs.outputs.full }}
    steps:
      - id: inputs
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            printf 'build=true\nfull=true\n' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'full=false' >>"$GITHUB_OUTPUT"
          # A new branch reports an all-zero before, which compares against nothing.
          if [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            echo 'build=true' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # Documentation reaches no executable. A path this list does not name
          # builds rather than skips, so a new directory never goes untested.
          changed=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" \
            --jq '.files[].filename' | grep -vE '^docs/|^LICENSE$|^[^/]+\.md$' || true)
          if [ -z "$changed" ]; then
            echo 'Documentation alone changed. Nothing to build.'
            echo 'build=false' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'Building for:\n%s\n' "$changed"
          echo 'build=true' >>"$GITHUB_OUTPUT"

  linux:
    name: Linux ${{ matrix.architecture }}
    needs: changes
    if: needs.changes.outputs.build == 'true' && contains(fromJSON('["all","linux-amd64","linux-arm64"]'), inputs.platform || 'all')
    runs-on: ${{ matrix.architecture == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
        # A main push builds amd64 alone. A dispatch naming one leg excludes the
        # other; exclude has nothing to remove for 'all' or a tag push, so both
        # legs run.
        exclude:
          - architecture: ${{ needs.changes.outputs.full == 'false' && 'arm64' || (inputs.platform || 'all') == 'linux-amd64' && 'arm64' || (inputs.platform || 'all') == 'linux-arm64' && 'amd64' || 'none' }}
    steps:
      - uses: actions/checkout@v7

      # setup-go sets GOTOOLCHAIN=local from v6 on, so go fetches no newer toolchain of
      # its own: this version must stay at or above the go line in packaging/launcher/go.mod.
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: false

      - name: Run the launcher unit tests
        working-directory: packaging/launcher
        run: go test ./...

      # The runner starts with about 14 GB free, the builder image takes 8.6 GB,
      # and the packer writes a compressed payload beside the 400 MB executable.
      # Printing the free space tells a later failure apart from a full disk.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build the executable
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            version=$REF_NAME
          else
            version="dev-${SHA:0:12}"
          fi
          docker build --target artifact --build-arg "DRUPACK_VERSION=$version" --output type=local,dest=dist .
          
      - name: Report the free space after the build
        run: df -h /

      - name: Run the harness unit tests
        run: python3 -m unittest discover -s tests/conformance -p 'test_harness.py'

      - name: Run the test scripts
        run: |
          python3 tests/conformance dist/drupack test-results/conformance

      - name: Start a SQLite site on a musl host
        run: |
          docker run -d --name alpine-site --network none \
            --mount type=bind,src="$PWD/dist/drupack",dst=/usr/local/bin/drupack,readonly \
            alpine@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d \
            drupack --data-dir /tmp/site --admin-user alpine-admin --admin-password Alpine.check.password.2026
          for attempt in $(seq 1 60); do
            if docker exec alpine-site wget -q -O /dev/null http://127.0.0.1:7225/user/login 2>/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs alpine-site
          exit 1

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-linux-${{ matrix.architecture }}
          path: test-results

      - uses: actions/upload-artifact@v7
        with:
          name: drupack-linux-${{ matrix.architecture }}
          path: dist/drupack
          if-no-files-found: error

  application:
    name: application
    needs: changes
    # windows and macos need this job, so skipping it skips them too.
    if: needs.changes.outputs.full == 'true' && contains(fromJSON('["all","windows-amd64","macos-arm64","macos-amd64"]'), inputs.platform || 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      # The runner starts with about 14 GB free, the builder image takes 8.6 GB.
      # Printing the free space tells a later failure apart from a full disk.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Export the application archive
        env:
          DRUPACK_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}
        run: |
          docker build --target build --build-arg "DRUPACK_VERSION=$DRUPACK_VERSION" -t drupack-build .
          container=$(docker create drupack-build)
          mkdir application
          docker cp "$container:/go/src/app/app-payload.tar" application/app-payload.tar
          docker cp "$container:/go/src/app/app_checksum.txt" application/app_checksum.txt
          docker rm "$container"

      - uses: actions/upload-artifact@v7
        with:
          name: application-archive
          path: application
          if-no-files-found: error

  windows:
    name: Windows amd64
    needs: application
    if: contains(fromJSON('["all","windows-amd64"]'), inputs.platform || 'all')
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: false

      - name: Run the launcher unit tests
        working-directory: packaging/launcher
        run: go test ./...

      - uses: actions/download-artifact@v8
        with:
          name: application-archive
          path: application

      - uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}\drupack\downloads
            ${{ runner.temp }}\drupack\vcpkg
            ~\AppData\Local\vcpkg\archives
            ~\go\pkg\mod
            ~\AppData\Local\go-build
          key: windows-build-${{ hashFiles('packaging/windows/build.ps1') }}

      - name: Build the executable
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if ($env:REF_TYPE -eq 'tag') {
            $version = $env:REF_NAME
          } else {
            $version = "dev-$($env:SHA.Substring(0,12))"
          }
          ./packaging/windows/build.ps1 -ApplicationDirectory application -Version $version -WorkDirectory "$env:RUNNER_TEMP\drupack" -Output dist\drupack.exe

      - name: Run the conformance suite
        run: python tests/conformance dist\drupack.exe test-results\conformance

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-windows-amd64
          path: test-results

      - uses: actions/upload-artifact@v7
        with:
          name: drupack-windows-amd64
          path: dist/drupack.exe
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.architecture }}
    needs: application
    if: contains(fromJSON('["all","macos-arm64","macos-amd64"]'), inputs.platform || 'all')
    runs-on: ${{ matrix.architecture == 'arm64' && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        architecture: [arm64, amd64]
        # A dispatch naming one leg excludes the other; exclude has nothing to
        # remove for 'all' or a tag push, so both legs run.
        exclude:
          - architecture: ${{ (inputs.platform || 'all') == 'macos-arm64' && 'amd64' || (inputs.platform || 'all') == 'macos-amd64' && 'arm64' || 'none' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: false

      - name: Run the launcher unit tests
        working-directory: packaging/launcher
        run: go test ./...

      - uses: actions/download-artifact@v8
        with:
          name: application-archive
          path: application

      - uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.temp }}/drupack/downloads
            ${{ runner.temp }}/drupack/buildroot
            ${{ runner.temp }}/drupack/pkgroot
          key: macos-${{ matrix.architecture }}-${{ hashFiles('packaging/macos/build.sh') }}

      - name: Build the executable
        env:
          # static-php-cli reads library releases from the GitHub API, which rate-limits anonymous requests.
          GITHUB_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            version=$REF_NAME
          else
            version="dev-${SHA:0:12}"
          fi
          DRUPACK_VERSION=$version bash packaging/macos/build.sh application "$RUNNER_TEMP/drupack" dist/drupack

      # Saved before the tests, so a failed test does not repeat the PHP build.
      - uses: actions/cache/save@v6
        with:
          path: |
            ${{ runner.temp }}/drupack/downloads
            ${{ runner.temp }}/drupack/buildroot
            ${{ runner.temp }}/drupack/pkgroot
          key: macos-${{ matrix.architecture }}-${{ hashFiles('packaging/macos/build.sh') }}

      - name: Run the test scripts
        run: |
          python3 tests/conformance dist/drupack test-results/conformance

      - name: Check the unsigned launch steps
        run: |
          cp dist/drupack test-results/quarantined
          xattr -w com.apple.quarantine "0081;$(printf '%x' "$(date +%s)");Safari;" test-results/quarantined
          xattr -d com.apple.quarantine test-results/quarantined
          test-results/quarantined --help

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-macos-${{ matrix.architecture }}
          path: test-results

      - uses: actions/upload-artifact@v7
        with:
          name: drupack-macos-${{ matrix.architecture }}
          path: dist/drupack
          if-no-files-found: error

  publish:
    needs: [linux, windows, macos]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: drupack-*
          path: candidates

      - name: Name assets and write checksums.txt and release.json
        run: |
          mkdir release
          for candidate in candidates/drupack-*/drupack*; do
            directory=${candidate%/*}
            target=${directory#candidates/drupack-}
            asset="drupack-${VERSION}-${target}${candidate##*/drupack}"
            cp "$candidate" "release/$asset"
            chmod 0755 "release/$asset"
            # GitHub's latest-release URL resolves a fixed file name, so each
            # asset also ships without its version for a copy-and-paste download.
            latest="drupack-${target}${candidate##*/drupack}"
            cp "release/$asset" "release/$latest"
            sha256=$(sha256sum "release/$asset" | cut -d ' ' -f 1)
            printf '%s  %s\n' "$sha256" "$asset" >>release/checksums.txt
            printf '%s  %s\n' "$sha256" "$latest" >>release/checksums.txt
            jq -n \
              --arg asset "$asset" \
              --arg target "$target" \
              --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}/${asset}" \
              --arg latest_url "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/${latest}" \
              --arg sha256 "$sha256" \
              --argjson size "$(stat --format=%s "release/$asset")" \
              '{asset: $asset, target: $target, url: $url, latest_url: $latest_url, sha256: $sha256, size: $size}'
          done | jq -s --arg version "$VERSION" --arg commit "$GITHUB_SHA" \
            '{version: $version, build_commit: $commit, assets: .}' >release/release.json

      - name: Generate the SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: release/drupack.cdx.json

      - name: Attest the release files
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/*

      - name: Publish the GitHub Release
        run: |
          gh release create "$VERSION" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Drupack $VERSION" \
            --generate-notes
