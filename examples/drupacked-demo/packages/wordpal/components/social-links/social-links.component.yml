name: 'Social Icons'
description: 'Display icons linking to your social profiles or sites.'
status: stable
group: 'WordPress: widgets'
links:
  - 'https://github.com/WordPress/wordpress-develop/tree/trunk/src/wp-includes/blocks/social-links'
