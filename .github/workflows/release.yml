name: Release
# A tag run and a main push run find their candidate run by this name.
run-name: ${{ inputs.version != '' && inputs.platform == 'all' && format('Release candidate {0}', inputs.version) || '' }}

on:
  push:
    branches:
      - main
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  # The full suite once a week, on main and under a dev version, so Linux arm64 and Windows arm64,
  # which a gate candidate tests with their start cases alone, still run every case. It publishes nothing.
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
    inputs:
      platform:
        description: Target to build and test; a tag push builds every platform unless its candidate run did.
        type: choice
        default: all
        options:
          - all
          - linux-amd64
          - linux-arm64
          - macos-arm64
          - macos-amd64
          - windows-amd64
      version:
        description: The version a candidate run builds, which its tag run then publishes.
        type: string
        default: ''
      suite:
        description: full tests every platform in full but macOS amd64, which runs its start cases in both; gate tests Linux amd64, macOS arm64 and Windows amd64 in full and the others with their start cases.
        type: choice
        default: full
        options:
          - full
          - gate

permissions:
  contents: read

env:
  # setup-go sets GOTOOLCHAIN=local from v6 on, so go fetches no newer toolchain of
  # its own: this version must stay at or above the go line in FrankenPHP's
  # caddy/go.mod. Each go.mod here and the Dockerfile's golang image carry the same
  # version. build/release/upstream.py moves it to the newest patch and copies it there.
  GO_VERSION: '1.27.4'
  # Go moves to the next entry after a "|" on any error, so a module fetch the
  # proxy drops mid-stream gets a second attempt. go.sum checks either answer.
  GOPROXY: https://proxy.golang.org|https://proxy.golang.org,direct

jobs:
  # A tag whose candidate run succeeded publishes that run's files, and a main push of
  # that commit builds nothing. Other tags, dispatches and the schedule cover every
  # platform (a dispatch can name one). Another main push covers Linux amd64 when it
  # touched something an executable carries; the comparison runs here because GitHub
  # leaves path filters on tag pushes undocumented.
  gate:
    name: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      build: ${{ steps.targets.outputs.build }}
      candidate: ${{ steps.targets.outputs.candidate }}
      image_tags: ${{ steps.targets.outputs.image_tags }}
      version: ${{ steps.targets.outputs.version }}
      linux: ${{ steps.targets.outputs.linux }}
      linux_tests: ${{ steps.targets.outputs.linux_tests }}
      linux_runtime: ${{ steps.targets.outputs.linux_runtime }}
      macos: ${{ steps.targets.outputs.macos }}
      macos_tests: ${{ steps.targets.outputs.macos_tests }}
      windows: ${{ steps.targets.outputs.windows }}
      windows_tests: ${{ steps.targets.outputs.windows_tests }}
      demo_repository: ${{ steps.demo.outputs.repository }}
      demo_ref: ${{ steps.demo.outputs.ref }}
    steps:
      - uses: actions/checkout@v7

      # upstream.yml writes the bump table into the candidate commit's message.
      - name: Show the candidate's bump
        if: github.ref_type == 'tag' || inputs.version != ''
        run: git log -1 --format='### %s%n%n%b' >>"$GITHUB_STEP_SUMMARY"

      - id: demo
        name: Name the demo commit
        run: |
          . build/release/demo-pin.sh
          printf 'repository=%s\nref=%s\n' "$demo_repository" "$demo_ref" >>"$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.demo.outputs.repository }}
          ref: ${{ steps.demo.outputs.ref }}
          path: demo
          persist-credentials: false

      - id: targets
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          PLATFORM: ${{ inputs.platform || 'all' }}
          NAMED: ${{ inputs.version }}
          SUITE: ${{ inputs.suite }}
        run: |
          python3 build/release/release-plan.py --ref-type "$GITHUB_REF_TYPE" --ref-name "$GITHUB_REF_NAME" \
            --event-name "$GITHUB_EVENT_NAME" --sha "$GITHUB_SHA" --before "$BEFORE" \
            --platform "$PLATFORM" --version "$NAMED" --suite "$SUITE" --repo "$GITHUB_REPOSITORY" \
            --targets launcher/internal/payload/targets.json --output "$GITHUB_OUTPUT"

  # A builder image carries the PHP its own build compiled, so one image serves
  # one libc on one architecture. Its content follows the inputs
  # runtime/builder/builder-tag.sh digests, and the registry holds it under that digest.
  linux-runtime:
    name: Linux ${{ matrix.arch }} ${{ matrix.libc }} runtime
    needs: gate
    if: needs.gate.outputs.linux_runtime != '[]'
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 180
    # static-php-cli and the sources it fetches run in this job, so its token
    # cannot write packages. payload pushes the image this job builds.
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.gate.outputs.linux_runtime) }}
    steps:
      - uses: actions/checkout@v7

      # Without this room a pull of the musl builder image ended in "no space left
      # on device", on a runner whose df had reported 86 GB free.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - id: builder
        name: Name the builder image
        env:
          BUILDER: ${{ matrix.builder }}
        run: |
          tag=$(bash runtime/builder/builder-tag.sh "$BUILDER")
          printf 'image=ghcr.io/%s-builder:%s\n' "$GITHUB_REPOSITORY" "$tag" >>"$GITHUB_OUTPUT"

      - name: Log in to the registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # An image under this tag carries the PHP this run needs, whatever run built
      # it. build-static.sh reads the token to raise its GitHub API rate limit
      # while it downloads the PHP and extension sources.
      - id: image
        name: Pull or build the builder image
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.builder.outputs.image }}
          BUILDER: ${{ matrix.builder }}
        run: |
          if docker pull -q "$IMAGE"; then
            exit 0
          fi
          bash runtime/builder/build-builder.sh "$BUILDER" "$IMAGE" "$RUNNER_TEMP/builder"
          echo 'built=true' >>"$GITHUB_OUTPUT"

      # The build below finds the image on the runner under the same name. A
      # fork's image stays there.
      - name: Save the builder image
        if: steps.image.outputs.built == 'true' && github.event.repository.fork == false
        env:
          IMAGE: ${{ steps.builder.outputs.image }}
        run: |
          mkdir builder-image
          docker save "$IMAGE" | zstd -T0 -3 >builder-image/image.tar.zst

      - if: steps.image.outputs.built == 'true' && github.event.repository.fork == false
        uses: actions/upload-artifact@v7
        with:
          name: builder-linux-${{ matrix.arch }}-${{ matrix.libc }}
          path: builder-image
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Build the runtime
        env:
          DRUPACK_ENGINE_VERSION: ${{ needs.gate.outputs.version }}
          IMAGE: ${{ steps.builder.outputs.image }}
          LIBC: ${{ matrix.libc }}
          BUILDER: ${{ matrix.builder }}
        run: |
          # The Dockerfile names each builder image's argument after the builder, upper case.
          docker build --target "runtime-$BUILDER-files" \
            --build-arg "DRUPACK_ENGINE_VERSION=$DRUPACK_ENGINE_VERSION" \
            --build-arg "${BUILDER^^}_BUILDER=$IMAGE" \
            --output "type=local,dest=runtime-$LIBC" .
          df -h /

      - uses: actions/upload-artifact@v7
        with:
          name: runtime-linux-${{ matrix.arch }}-${{ matrix.libc }}
          path: runtime-${{ matrix.libc }}
          if-no-files-found: error

      # The runtime reports on a runner of its own architecture. The job image
      # carries the report for site builds, and the publish job merges it.
      - name: Report the runtime's components
        env:
          LIBC: ${{ matrix.libc }}
          TARGET: linux-${{ matrix.arch }}${{ matrix.suffix }}
        run: |
          mkdir runtime-components
          python3 build/release/sbom.py runtime --target "$TARGET" --libraries "runtime-$LIBC/runtime-libraries.txt" \
            "runtime-$LIBC/out/drupack" >"runtime-components/$TARGET.json"

      - uses: actions/upload-artifact@v7
        with:
          name: runtime-components-linux-${{ matrix.arch }}-${{ matrix.libc }}
          path: runtime-components
          if-no-files-found: error

  # The application (PHP source, vendor, translations, seeded database) is the same
  # on every platform, so every executable packs this one build. Every run pushes
  # the job image under the commit for build.yml; publish names it after the version.
  # It also pushes each builder image linux-runtime built, before it runs any build
  # output. Loading and pushing an image runs no code from it, and this job names
  # each image itself, so a loaded archive can push under no other name.
  payload:
    name: payload
    needs: [gate, linux-runtime]
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: ${{ needs.gate.outputs.demo_repository }}
          ref: ${{ needs.gate.outputs.demo_ref }}
          path: demo
          persist-credentials: false

      # The later steps run the runtime in containers that mount the workspace, so this
      # step runs first, before any build output runs, and logs out when done. A leg
      # that built nothing uploaded no artifact.
      - name: Push the builder images
        if: github.event.repository.fork == false
        env:
          GH_TOKEN: ${{ github.token }}
          LINUX_RUNTIME: ${{ needs.gate.outputs.linux_runtime }}
        # After docker load, docker uploads a layer before it learns ghcr holds it.
        # One lane per architecture runs in parallel, so a lane's second image
        # finds the base layers its first image pushed.
        run: |
          push_lane() {
            local arch=$1
            jq -r --arg arch "$arch" '.[] | select(.arch == $arch) | "\(.libc) \(.builder)"' <<<"$LINUX_RUNTIME" | while read -r libc builder; do
              name=builder-linux-$arch-$libc
              id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$name" --jq '.artifacts[0].id // empty')
              if [ -z "$id" ]; then
                echo "$name: no image built"
                continue
              fi
              case $arch in
                amd64) machine=x86_64 ;;
                arm64) machine=aarch64 ;;
                *) echo "$name: no machine type for $arch" >&2; exit 1 ;;
              esac
              image=ghcr.io/$GITHUB_REPOSITORY-builder:$(bash runtime/builder/builder-tag.sh "$builder" "$machine")
              gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" >"$RUNNER_TEMP/$name.zip"
              unzip -q "$RUNNER_TEMP/$name.zip" -d "$RUNNER_TEMP/$name"
              zstd -dc "$RUNNER_TEMP/$name/image.tar.zst" | docker load
              docker push "$image"
            done
          }
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          arches=()
          pids=()
          for arch in $(jq -r '[.[].arch] | unique[]' <<<"$LINUX_RUNTIME"); do
            push_lane "$arch" >"$RUNNER_TEMP/push-$arch.log" 2>&1 &
            arches+=("$arch")
            pids+=($!)
          done
          status=0
          for i in "${!pids[@]}"; do
            wait "${pids[$i]}" || status=1
            echo "::group::${arches[$i]} images"
            cat "$RUNNER_TEMP/push-${arches[$i]}.log"
            echo "::endgroup::"
          done
          docker logout ghcr.io
          exit "$status"

      - uses: actions/download-artifact@v8
        with:
          pattern: runtime-linux-*
          path: runtime-artifacts

      - uses: actions/download-artifact@v8
        with:
          pattern: runtime-components-linux-*
          path: runtime-components
          merge-multiple: true

      # The runtime jobs' exports stand in for the runtimes stage, so no builder
      # image is pulled here. A run of every platform built all four.
      - name: Build the job image
        env:
          DRUPACK_ENGINE_VERSION: ${{ needs.gate.outputs.version }}
          LINUX_RUNTIME: ${{ needs.gate.outputs.linux_runtime }}
        run: |
          mkdir runtimes
          # download-artifact extracts a lone match straight into its path, with no
          # directory named after it, so the gate's one runtime names that directory.
          if [ -d runtime-artifacts/out ]; then
            lone=$(jq -r '.[0] | "runtime-linux-\(.arch)-\(.libc)"' <<<"$LINUX_RUNTIME")
            mkdir "runtime-artifacts/$lone"
            mv runtime-artifacts/out "runtime-artifacts/$lone/out"
          fi
          for artifact in runtime-artifacts/runtime-linux-*; do
            target=${artifact#runtime-artifacts/runtime-}
            mv "$artifact/out" "runtimes/$target"
          done
          chmod +x runtimes/*/drupack
          ls runtimes
          docker build --target job --build-arg RUNTIMES=release-runtimes --build-context release-runtimes=runtimes \
            --build-arg RUNTIME_COMPONENTS=release-runtime-components \
            --build-context release-runtime-components=runtime-components \
            --build-arg "DRUPACK_ENGINE_VERSION=$DRUPACK_ENGINE_VERSION" -t drupack-job .

      - name: Export the application payload
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/src" -w /src drupack-job \
            drupack-build --site demo --payload-only --output dist

      - name: Export the engine payload
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/src" -w /src drupack-job \
            drupack-build --engine-executable --payload-only --output dist/engine

      # The macOS and Windows jobs pack the variant fixture from this payload, which
      # holds each of their targets' Node archives.
      - name: Export the variant fixture payload
        run: |
          bash build/test/variant-fixture.sh demo "$RUNNER_TEMP/variant-site"
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/src" -v "$RUNNER_TEMP/variant-site:/variant-site" -w /src drupack-job \
            drupack-build --site /variant-site --payload-only --output dist/variant

      # A main push and a tag push of one commit run at once. A release's image is
      # sha-COMMIT and a main run pushes dev-COMMIT, so a main run never replaces it.
      - name: Push the job image under this commit
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_TAGS: ${{ needs.gate.outputs.image_tags }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for prefix in $IMAGE_TAGS; do
            docker tag drupack-job "ghcr.io/$GITHUB_REPOSITORY-build:$prefix-$GITHUB_SHA"
            docker push "ghcr.io/$GITHUB_REPOSITORY-build:$prefix-$GITHUB_SHA"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: payload-archive
          path: dist/payload
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: engine-payload-archive
          path: dist/engine/payload
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: variant-payload-archive
          path: dist/variant/payload
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }} (${{ matrix.shard || 'start cases' }})
    # GitHub waits on the whole linux-runtime matrix, so this architecture also
    # waits on the other one's two legs. With the builder images published every
    # leg finishes within a minute of the rest.
    needs: [gate, payload, linux-runtime]
    if: needs.gate.outputs.linux != '[]'
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.gate.outputs.linux_tests) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: ${{ needs.gate.outputs.demo_repository }}
          ref: ${{ needs.gate.outputs.demo_ref }}
          path: demo
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Run the Go unit tests
        if: matrix.units
        shell: bash
        run: bash build/test/go-tests.sh

      - uses: actions/download-artifact@v8
        with:
          name: runtime-linux-${{ matrix.arch }}-musl
          path: runtime-musl

      - uses: actions/download-artifact@v8
        with:
          name: runtime-linux-${{ matrix.arch }}-glibc
          path: runtime-glibc

      - uses: actions/download-artifact@v8
        with:
          name: payload-archive
          path: dist/payload

      - uses: actions/download-artifact@v8
        with:
          name: engine-payload-archive
          path: dist/engine-payload

      # Each file carries one runtime. The launcher itself carries no cgo, so both
      # files start on a glibc and a musl host alike.
      - name: Pack the executables
        working-directory: launcher
        env:
          CGO_ENABLED: '0'
          DRUPACK_ENGINE_VERSION: ${{ needs.gate.outputs.version }}
          TARGET: linux-${{ matrix.arch }}
        run: |
          chmod +x ../runtime-musl/out/drupack ../runtime-glibc/out/drupack
          mkdir -p ../dist/musl ../dist/engine/musl
          for libc in glibc musl; do
            # The musl files land in their own directories, since each artifact holds one file named NAME.
            directory='' target=$TARGET
            if [ "$libc" = musl ]; then directory=/musl target=$TARGET-musl; fi
            go run ./cmd/pack -target "$target" -runtime "../runtime-$libc/out" -payload ../dist/payload \
              -version "$DRUPACK_ENGINE_VERSION" -output "../dist$directory/drupacked-demo"
            go run ./cmd/pack -engine -target "$target" -runtime "../runtime-$libc/out" -payload ../dist/engine-payload \
              -version "$DRUPACK_ENGINE_VERSION" -output "../dist/engine$directory/drupack"
          done
          cp ../dist/payload/site.json ../dist/site.json

      - name: Run the Python unit tests
        if: matrix.units
        run: bash build/test/unit-tests.sh

      - name: Run the test scripts
        env:
          DRUPACK_TEST_ENGINE: dist/engine/drupack
          DRUPACK_SHARD: ${{ matrix.shard }}
          DRUPACK_SUITE: ${{ matrix.smoke && 'smoke' || 'full' }}
        run: |
          python3 tests/conformance dist/drupacked-demo test-results/conformance --site-tests demo/tests

      - name: Check each file's runtime and size
        if: matrix.first
        run: |
          set -eu
          for file in dist/drupacked-demo dist/engine/drupack; do
            "$file" --version | grep ', glibc)$'
          done
          for file in dist/musl/drupacked-demo dist/engine/musl/drupack; do
            "$file" --version | grep ', musl)$'
          done
          for file in dist/drupacked-demo dist/musl/drupacked-demo dist/engine/drupack dist/engine/musl/drupack; do
            printf '%s: %d MB\n' "$file" "$(( $(stat -c %s "$file") / 1000000 ))"
          done

      - name: Start a SQLite site on a musl host
        if: matrix.first
        run: |
          docker run -d --name alpine-site --network none \
            --mount type=bind,src="$PWD/dist/musl/drupacked-demo",dst=/usr/local/bin/drupacked-demo,readonly \
            alpine@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d \
            drupacked-demo --foreground --data-dir /tmp/site --admin-user alpine-admin --admin-password Alpine.check.password.2026
          for _ in $(seq 1 60); do
            if docker exec alpine-site wget -q -O /dev/null http://127.0.0.1:7225/user/login 2>/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs alpine-site
          exit 1

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-linux-${{ matrix.arch }}-${{ strategy.job-index }}
          # The folder also holds each case's project, about 2 GB over 400,000 files.
          path: |
            test-results/**/*.log
            test-results/**/run.out
            test-results/**/run.err

      - uses: actions/upload-artifact@v7
        if: matrix.first
        with:
          name: drupack-linux-${{ matrix.arch }}
          path: dist/engine/drupack
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: matrix.first
        with:
          name: drupack-linux-${{ matrix.arch }}-musl
          path: dist/engine/musl/drupack
          if-no-files-found: error

  # install.ps1 installs the amd64 build on Windows on Arm too, which runs it under
  # the system's x64 emulation. This job builds the amd64 executables once, and the
  # windows-test jobs run the suite on those files on both hosts.
  windows:
    name: Windows amd64 build
    needs: [gate, payload]
    if: needs.gate.outputs.windows != '[]'
    runs-on: windows-2025
    # A cold run compiles PHP and its libraries for about 22 minutes ahead of the link.
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      # The Windows build files and lock calls; lint runs in the Linux amd64 job.
      - name: Run the Go unit tests
        shell: bash
        run: bash build/test/go-tests.sh test

      - uses: actions/download-artifact@v8
        with:
          name: payload-archive
          path: dist/payload

      - uses: actions/download-artifact@v8
        with:
          name: engine-payload-archive
          path: dist/engine-payload

      - uses: actions/download-artifact@v8
        with:
          name: variant-payload-archive
          path: dist/variant-payload

      # The buildroot holds the PHP the allowlist names and the libraries the versions
      # file records, so the key hashes every input of the compile. The link reads
      # headers static-php-cli leaves in these folders of PHP's source tree. Its
      # downloads and its build tools serve the compile alone, which a hit skips.
      - uses: actions/cache/restore@v6
        id: compile-cache
        with:
          path: |
            ${{ runner.temp }}\drupack\buildroot
            ${{ runner.temp }}\drupack\source\php-src\main
            ${{ runner.temp }}\drupack\source\php-src\Zend
            ${{ runner.temp }}\drupack\source\php-src\TSRM
            ${{ runner.temp }}\drupack\source\php-src\ext
            ${{ runner.temp }}\drupack\source\php-src\sapi
            ${{ runner.temp }}\drupack\source\php-src\win32
            ~\go\pkg\mod
            ~\AppData\Local\go-build
          key: windows-build-${{ hashFiles('build/windows/build.ps1', 'runtime/builder/builder-inputs.sh', 'runtime/builder/fetch-spc.sh', 'runtime/builder/fetch-commit.sh', 'runtime/builder/branch-pins.txt', 'runtime/builder/fetch-branch-pins.sh', 'runtime/builder/spc-sqlite.patch', 'runtime/builder/spc-icu.patch', 'runtime/builder/library-versions.txt', 'runtime/extensions/extensions-list.sh', 'runtime/extensions/php-extensions.txt', 'runtime/extensions/php-extension-libs.txt') }}

      # A compile reads each artifact of branch-pins.txt from its checkout, and SourceForge,
      # which serves pthreads4w, has failed a download. The restore on every run keeps the
      # entry in use, and the save comes before the compile, which builds the checkouts in place.
      - uses: actions/cache/restore@v6
        id: pins-cache
        with:
          path: ${{ runner.temp }}\drupack\branch-pins
          key: windows-branch-pins-${{ hashFiles('runtime/builder/branch-pins.txt', 'runtime/builder/fetch-branch-pins.sh', 'runtime/builder/fetch-commit.sh') }}

      - name: Fetch the branch-head sources
        if: ${{ steps.compile-cache.outputs.cache-hit != 'true' && steps.pins-cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: bash runtime/builder/fetch-branch-pins.sh windows "$(cygpath -m "$RUNNER_TEMP")/drupack/branch-pins" >/dev/null

      - uses: actions/cache/save@v6
        if: ${{ steps.compile-cache.outputs.cache-hit != 'true' && steps.pins-cache.outputs.cache-hit != 'true' }}
        with:
          path: ${{ runner.temp }}\drupack\branch-pins
          key: ${{ steps.pins-cache.outputs.cache-primary-key }}

      - name: Build the executables
        env:
          # static-php-cli reads library releases from the GitHub API, which rate-limits anonymous requests.
          GITHUB_TOKEN: ${{ github.token }}
          DRUPACK_ENGINE_VERSION: ${{ needs.gate.outputs.version }}
        run: |
          ./build/windows/build.ps1 -PayloadDirectory dist\payload -Version $env:DRUPACK_ENGINE_VERSION -WorkDirectory "$env:RUNNER_TEMP\drupack" -Output dist\drupacked-demo.exe -EnginePayloadDirectory dist\engine-payload -EngineOutput dist\engine\drupack.exe
          Copy-Item dist\payload\site.json dist\site.json

      # build.ps1 writes the marker when the compile ends, so a failed link keeps
      # the compile and a failed compile saves nothing.
      - name: Find the compiled PHP
        id: compiled
        if: ${{ !cancelled() && steps.compile-cache.outputs.cache-hit != 'true' }}
        run: |
          if (Test-Path "$env:RUNNER_TEMP\drupack\buildroot\compiled") { 'present=true' >> $env:GITHUB_OUTPUT }

      - uses: actions/cache/save@v6
        if: ${{ !cancelled() && steps.compiled.outputs.present == 'true' }}
        with:
          path: |
            ${{ runner.temp }}\drupack\buildroot
            ${{ runner.temp }}\drupack\source\php-src\main
            ${{ runner.temp }}\drupack\source\php-src\Zend
            ${{ runner.temp }}\drupack\source\php-src\TSRM
            ${{ runner.temp }}\drupack\source\php-src\ext
            ${{ runner.temp }}\drupack\source\php-src\sapi
            ${{ runner.temp }}\drupack\source\php-src\win32
            ~\go\pkg\mod
            ~\AppData\Local\go-build
          key: ${{ steps.compile-cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v7
        with:
          name: drupack-windows-amd64
          path: dist/engine/drupack.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: runtime-windows-amd64
          path: ${{ runner.temp }}\drupack\runtime
          if-no-files-found: error

      - name: Report the runtime's components
        run: |
          New-Item -ItemType Directory -Path runtime-components | Out-Null
          python build/release/sbom.py runtime --target windows-amd64 --spc-cache "$env:RUNNER_TEMP\drupack\buildroot\.cache.json" "$env:RUNNER_TEMP\drupack\runtime\frankenphp.exe" >runtime-components\windows-amd64.json

      - uses: actions/upload-artifact@v7
        with:
          name: runtime-components-windows-amd64
          path: runtime-components
          if-no-files-found: error

      # The variant fixture packs on the runtime the build above left in its work
      # directory, with the amd64 launcher the release ships.
      - name: Pack the variant fixture
        env:
          DRUPACK_ENGINE_VERSION: ${{ needs.gate.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path dist\variant | Out-Null
          Push-Location launcher
          go run ./cmd/pack -target windows-amd64 -runtime "$env:RUNNER_TEMP\drupack\runtime" -payload ..\dist\variant-payload -version $env:DRUPACK_ENGINE_VERSION -output ..\dist\variant\variant-demo.exe
          Pop-Location
          Copy-Item dist\variant-payload\site.json dist\variant\site.json

      # The files the windows-test jobs run. The name stays outside the patterns the
      # sbom and publish jobs download. The retention stays the default: the gate
      # rebuilds a candidate when any of its artifacts expired.
      - uses: actions/upload-artifact@v7
        with:
          name: suite-windows-amd64
          path: |
            dist/drupacked-demo.exe
            dist/site.json
            dist/engine/drupack.exe
            dist/variant
          compression-level: 0
          if-no-files-found: error

  # Each job runs one share of the test classes on the files the windows job built.
  # Emulation doubles each case's time, so the Arm host runs the variant cases
  # in a job of their own.
  windows-test:
    name: ${{ matrix.name }}
    needs: [gate, windows]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.gate.outputs.windows_tests) }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: ${{ needs.gate.outputs.demo_repository }}
          ref: ${{ needs.gate.outputs.demo_ref }}
          path: demo
          persist-credentials: false

      # The suite packs its fixture launchers with Go.
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - uses: actions/download-artifact@v8
        with:
          name: suite-windows-amd64
          path: dist

      - name: Run the conformance suite
        if: matrix.smoke || matrix.shard != ''
        env:
          DRUPACK_TEST_ENGINE: dist\engine\drupack.exe
          DRUPACK_SHARD: ${{ matrix.shard }}
          DRUPACK_SUITE: ${{ matrix.smoke && 'smoke' || 'full' }}
        run: python tests/conformance dist\drupacked-demo.exe test-results\conformance --site-tests demo\tests

      - name: Run the variant fixture cases
        if: matrix.variant
        run: python tests/conformance dist\variant\variant-demo.exe test-results\variant -k Node -k MercureHub -k ProjectRules

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.results }}
          # The folder also holds each case's project, about 2 GB over 400,000 files.
          path: |
            test-results/**/*.log
            test-results/**/run.out
            test-results/**/run.err

  # Builds each architecture's executables once, one job per architecture, so the
  # macos-test jobs wait for the arm64 build alone. They run the suite on those files,
  # and an architecture with no test row runs the start cases in its build job.
  macos-arm64:
    name: macOS arm64 build
    needs: [gate, payload]
    if: contains(needs.gate.outputs.macos, 'arm64')
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/macos-build
        with:
          arch: arm64
          version: ${{ needs.gate.outputs.version }}
          go-version: ${{ env.GO_VERSION }}
          go-tests: 'true'
          start-cases: ${{ !contains(fromJSON(needs.gate.outputs.macos_tests).*.arch, 'arm64') }}

  macos-amd64:
    name: macOS amd64 build
    needs: [gate, payload]
    if: contains(needs.gate.outputs.macos, 'amd64')
    runs-on: macos-15-intel
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/macos-build
        with:
          arch: amd64
          version: ${{ needs.gate.outputs.version }}
          go-version: ${{ env.GO_VERSION }}
          go-tests: 'false'
          start-cases: ${{ !contains(fromJSON(needs.gate.outputs.macos_tests).*.arch, 'amd64') }}

  # Each job runs one share of the test classes on the files the macos-arm64 job built.
  macos-test:
    name: macOS ${{ matrix.arch }} tests (${{ matrix.shard }})
    needs: [gate, macos-arm64]
    if: needs.gate.outputs.macos_tests != '[]'
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.gate.outputs.macos_tests) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: ${{ needs.gate.outputs.demo_repository }}
          ref: ${{ needs.gate.outputs.demo_ref }}
          path: demo
          persist-credentials: false

      # The suite packs its fixture launchers with Go.
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - uses: actions/download-artifact@v8
        with:
          name: suite-macos-${{ matrix.arch }}
          path: dist

      # An artifact keeps no file mode.
      - name: Mark the executables
        run: chmod +x dist/drupacked-demo dist/engine/drupack dist/variant/variant-demo

      - name: Run the test scripts
        env:
          DRUPACK_TEST_ENGINE: dist/engine/drupack
          # Each architecture's last row also runs the variant cases. Every row
          # says so, since each one deals all the shares to find its own.
          DRUPACK_SHARD: ${{ matrix.shard }}+extra
        run: |
          python3 tests/conformance dist/drupacked-demo test-results/conformance --site-tests demo/tests

      - name: Run the variant fixture cases
        if: matrix.variant
        run: python3 tests/conformance dist/variant/variant-demo test-results/variant -k Node -k MercureHub -k ProjectRules

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.results }}
          # The folder also holds each case's project, about 2 GB over 400,000 files.
          path: |
            test-results/**/*.log
            test-results/**/run.out
            test-results/**/run.err

  # An all-platform dispatch and the weekly schedule also run build/test/qa.sh, one phase
  # per job. upstream.yml dispatches one for each release candidate.
  qa:
    name: QA
    needs: [gate, payload]
    # A fork pushes no builder image, and the demo phase pulls one.
    if: github.event.repository.fork == false && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.platform == 'all'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        phase: [demo, variant, host]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      # govulncheck reads the vulnerability database when it runs, so a candidate
      # fails once a reported vulnerability reaches the code or the pinned Go.
      - name: Check the Go modules for vulnerabilities
        if: matrix.phase == 'host'
        run: |
          GOBIN=$RUNNER_TEMP go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          for module in $(git ls-files '*/go.mod'); do
            for goos in linux darwin windows; do
              (cd "$(dirname -- "$module")" && GOOS=$goos "$RUNNER_TEMP/govulncheck" ./...)
            done
          done

      # runtime/frankenphp/adapt-test.sh, which the demo phase runs, works in the glibc builder
      # image that the payload job of this run published under its digest tag.
      - name: Pull the glibc builder image
        if: matrix.phase == 'demo'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image=ghcr.io/$GITHUB_REPOSITORY-builder:$(bash runtime/builder/builder-tag.sh gnu)
          docker pull -q "$image"
          docker tag "$image" drupack-builder-gnu:local

      - uses: actions/download-artifact@v8
        with:
          pattern: runtime-linux-amd64-*
          path: ${{ runner.temp }}/runtime-artifacts

      # The job image takes the runtime jobs' files. A build from the builder images
      # took 4 minutes after a 5 minute pull.
      - name: Run build/test/qa.sh
        env:
          PHASE: ${{ matrix.phase }}
          DRUPACK_ENGINE_VERSION: ${{ needs.gate.outputs.version }}
          DRUPACK_QA_RUNTIMES: ${{ runner.temp }}/runtimes
        run: |
          set -o pipefail
          mkdir "$DRUPACK_QA_RUNTIMES"
          for libc in musl glibc; do
            mv "$RUNNER_TEMP/runtime-artifacts/runtime-linux-amd64-$libc/out" "$DRUPACK_QA_RUNTIMES/linux-amd64-$libc"
          done
          chmod +x "$DRUPACK_QA_RUNTIMES"/*/drupack
          bash build/test/qa.sh "$PHASE" 2>&1 | tee "$RUNNER_TEMP/qa.log"

      - name: Summarize the QA
        if: always()
        env:
          PHASE: ${{ matrix.phase }}
        run: |
          {
            printf '### build/test/qa.sh %s\n\n```\n' "$PHASE"
            grep -E '^(Ran |OK|FAILED|ok |FAIL)' "$RUNNER_TEMP/qa.log" || true
            printf '```\n'
          } >>"$GITHUB_STEP_SUMMARY"
          # A phase keeps its builds' test results, so its log shows the room left.
          df -h /

      # build/test/qa.sh works under /tmp/drupack-qa, one folder per checkout name.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-qa-${{ matrix.phase }}
          path: |
            /tmp/drupack-qa/**/*.log
            /tmp/drupack-qa/**/run.out
            /tmp/drupack-qa/**/run.err

  # A tag run that publishes its candidate's files skips every build job.
  # syft and the action run in a job of their own, whose token writes nothing.
  # The scans read the downloaded folders as they land: the merge keeps each
  # component's name, version and identifiers, never its file path.
  sbom:
    needs: [gate, linux, windows, windows-test, macos-arm64, macos-amd64, macos-test]
    if: ${{ !cancelled() && !failure() && github.ref_type == 'tag' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      # download-artifact reads another run only when it has a token, and its own
      # run when the token is empty.
      - uses: actions/download-artifact@v8
        with:
          pattern: drupack-*
          path: candidates
          run-id: ${{ needs.gate.outputs.candidate || github.run_id }}
          github-token: ${{ needs.gate.outputs.candidate && github.token || '' }}

      - uses: actions/download-artifact@v8
        with:
          pattern: runtime-macos-*
          path: runtimes
          run-id: ${{ needs.gate.outputs.candidate || github.run_id }}
          github-token: ${{ needs.gate.outputs.candidate && github.token || '' }}

      - uses: actions/download-artifact@v8
        with:
          name: runtime-windows-amd64
          path: runtimes/runtime-windows-amd64
          run-id: ${{ needs.gate.outputs.candidate || github.run_id }}
          github-token: ${{ needs.gate.outputs.candidate && github.token || '' }}

      - name: Make the scans folder
        run: mkdir "$RUNNER_TEMP/scans"

      # syft reads the launcher's Go modules from the executables, and FrankenPHP's
      # from the macOS and Windows runtimes. upload-artifact is off: the action's
      # own artifact, drupack-sbom.cyclonedx.json, would match the drupack-*
      # download above on a rerun of this job.
      - name: Scan the executables
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: candidates
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/scans/executables.cdx.json
          upload-artifact: false

      - name: Scan the runtimes
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: runtimes
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/scans/runtimes.cdx.json
          upload-artifact: false

      - uses: actions/upload-artifact@v7
        with:
          name: sbom-scans
          path: ${{ runner.temp }}/scans
          if-no-files-found: error

  publish:
    needs: [gate, sbom]
    if: ${{ !cancelled() && !failure() && github.ref_type == 'tag' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      # download-artifact reads another run only when it has a token, and its own
      # run when the token is empty.
      - uses: actions/download-artifact@v8
        with:
          pattern: drupack-*
          path: candidates
          run-id: ${{ needs.gate.outputs.candidate || github.run_id }}
          github-token: ${{ needs.gate.outputs.candidate && github.token || '' }}

      # A tag's files come from a run of every platform, so each macOS runtime lands
      # in a directory named after its artifact. A lone match would land in the path
      # itself, hence the Windows runtime's own step.
      - uses: actions/download-artifact@v8
        with:
          pattern: runtime-macos-*
          path: runtimes
          run-id: ${{ needs.gate.outputs.candidate || github.run_id }}
          github-token: ${{ needs.gate.outputs.candidate && github.token || '' }}

      - uses: actions/download-artifact@v8
        with:
          name: runtime-windows-amd64
          path: runtimes/runtime-windows-amd64
          run-id: ${{ needs.gate.outputs.candidate || github.run_id }}
          github-token: ${{ needs.gate.outputs.candidate && github.token || '' }}

      - uses: actions/download-artifact@v8
        with:
          pattern: runtime-components-*
          path: runtime-components
          merge-multiple: true
          run-id: ${{ needs.gate.outputs.candidate || github.run_id }}
          github-token: ${{ needs.gate.outputs.candidate && github.token || '' }}

      # Each artifact is NAME-TARGET holding one file, NAME or NAME.exe. The loop
      # names each file NAME-TARGET, keeping .exe, as release-files.py reads it.
      - name: Write the release files
        run: |
          mkdir built
          for candidate in candidates/*/*; do
            directory=${candidate%/*}
            file=${candidate##*/}
            cp "$candidate" "built/${directory##*/}${file#"${file%.exe}"}"
          done
          runtimes=()
          for runtime in runtimes/*; do
            runtimes+=(--runtime "$runtime")
          done
          python3 build/release/release-files.py --output release --version "$VERSION" \
            --base-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$VERSION" \
            --commit "$GITHUB_SHA" "${runtimes[@]}" built/*

      - uses: actions/download-artifact@v8
        with:
          name: sbom-scans
          path: ${{ runner.temp }}/scans

      # Each runtime's report names what the executables carry compressed. A site
      # build reads the macOS and Windows reports from runtime-components.json.
      - name: Write the SBOM
        run: |
          python3 build/release/sbom.py merge --name drupack --version "$VERSION" \
            --runtime-components runtime-components/*.json --output release/drupack.cdx.json \
            "$RUNNER_TEMP/scans/executables.cdx.json" "$RUNNER_TEMP/scans/runtimes.cdx.json"
          jq -s add runtime-components/*.json >release/runtime-components.json

      - name: Attest the release files
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release/*

      # Site builds pull the job image by the engine's version.
      - name: Name the job image after the version
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create --tag "ghcr.io/$GITHUB_REPOSITORY-build:$VERSION" \
            "ghcr.io/$GITHUB_REPOSITORY-build:sha-$GITHUB_SHA"

      # GitHub refuses github.token a release whose commit differs from main in
      # .github/workflows, which happens once main moves during a tag run.
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
        run: |
          # The pins the tag's upstream run moved open the notes. A tag with none gives an
          # empty file, and gh then sends the generated notes alone.
          python3 build/release/release-node.py upgrades "$VERSION" >"$RUNNER_TEMP/upgrades.md"
          gh release create "$VERSION" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Drupack $VERSION" \
            --notes-file "$RUNNER_TEMP/upgrades.md" \
            --generate-notes
